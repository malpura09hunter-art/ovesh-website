<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ovesh PPC — C Compiler</title><style>:root{--bg:#f8fafc;--panel:#fff;--editor:#f8fafc;--term:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--accent2:#4f46e5;--input:#fff;--shadow:0 8px 30px rgba(15,23,42,.08)}[data-theme=dark]{--bg:#0b1120;--panel:#111827;--editor:#0f172a;--term:#0b1220;--border:#243044;--text:#f8fafc;--muted:#94a3b8;--input:#0f172a;--shadow:0 8px 30px rgba(0,0,0,.22)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}body{overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.3px}.logo{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:550;letter-spacing:0}.sp{flex:1}.badge{font-size:10px;color:var(--muted);border:1px solid var(--border);padding:6px 9px;border-radius:99px}.btn{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);font-weight:700;cursor:pointer}.btn:hover{border-color:var(--accent)}.run{background:var(--accent);color:#fff;border-color:var(--accent)}.work{flex:1;min-height:0;display:grid;grid-template-columns:50% 50%}.panel{min-width:0;min-height:0;display:flex;flex-direction:column}.left{border-right:1px solid var(--border)}.head{height:42px;flex:0 0 42px;display:flex;align-items:center;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border);font-size:11px;font-weight:750;letter-spacing:.4px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px}.code{flex:1;width:100%;resize:none;border:0;outline:0;background:var(--editor);color:var(--text);padding:18px;font:14px/1.7 Consolas,monospace}.terminal{background:var(--term)}.term{flex:1;min-height:0;overflow:auto;padding:18px;font:14px/1.7 Consolas,monospace;white-space:pre-wrap}.entry{display:flex;align-items:center;padding:0 18px 16px;font:14px Consolas,monospace}.entry span{color:var(--accent);font-weight:800}.entry input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;margin-left:8px}.status{margin-left:auto;color:var(--muted);font-size:10px}.theme{font-size:16px;padding:7px 9px}.auth{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg)}.box{width:min(410px,calc(100% - 30px));padding:30px;border:1px solid var(--border);border-radius:20px;background:var(--panel);box-shadow:var(--shadow)}.box h1{margin:0 0 4px}.box p{color:var(--muted);font-size:13px}.box input{width:100%;padding:12px;margin:15px 0;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:9px;outline:0}.unlock{padding:11px 16px;background:var(--accent);color:white;border:0;border-radius:9px;font-weight:800;cursor:pointer}.msg{color:#dc2626;font-size:12px}.hidden{display:none!important}.access{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,10,20,.72);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .35s ease}.access.show{opacity:1;pointer-events:auto}.access-card{width:min(470px,calc(100% - 32px));padding:34px 30px;text-align:center;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:var(--panel);box-shadow:0 25px 80px rgba(0,0,0,.35);transform:translateY(18px) scale(.96);transition:transform .5s cubic-bezier(.2,.8,.2,1)}.access.show .access-card{transform:none}.access-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:28px;box-shadow:0 12px 35px rgba(37,99,235,.35);animation:pop .7s cubic-bezier(.2,1.4,.4,1)}.access-card h2{margin:0;font-size:22px}.access-card p{margin:7px 0 0;color:var(--muted);font-size:13px}.grant{margin-top:18px;display:inline-flex;align-items:center;gap:7px;color:#16a34a;font-size:12px;font-weight:800}.check{width:18px;height:18px;border-radius:50%;background:#16a34a;color:white;display:grid;place-items:center;font-size:11px}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}.progress{height:3px;margin-top:20px;background:var(--border);overflow:hidden;border-radius:9px}.progress i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:sweep 1.7s ease forwards}@media(max-width:800px){.work{grid-template-columns:1fr;grid-template-rows:50% 50%;overflow:auto}.left{border-right:0;border-bottom:1px solid var(--border)}.btn:not(.run){display:none}.badge{display:none}}</style></head><body><div class="auth" id="auth"><div class="box"><div class="brand"><div class="logo">O</div><div>Ovesh PPC<small>Personal Programming Compiler</small></div></div><p>Enter password to continue.</p><form id="login"><input id="pw" type="password" placeholder="Enter password" autofocus><button class="unlock">Continue</button></form><div class="msg" id="msg"></div></div></div><div class="access" id="access"><div class="access-card"><div class="access-icon">✓</div><h2>Ovesh PPC Compiler</h2><p>Access granted. Initializing your programming workspace…</p><div class="grant"><span class="check">✓</span> Authentication successful</div><div class="progress"><i></i></div></div></div><div class="app" id="app" style="display:none"><header class="top"><div class="brand"><div class="logo">O</div><div>Ovesh PPC<small>C Compiler</small></div></div><span class="badge">● Compiler Ready</span><div class="sp"></div><button class="btn theme" id="theme" title="Toggle theme">☼</button><button class="btn" id="copy">Copy</button><button class="btn" id="clear">Clear</button><button class="btn run" id="run">▶ Run</button></header><main class="work"><section class="panel left"><div class="head"><span class="dot"></span>main.c <span class="status">C / GCC</span></div><textarea class="code" id="code" spellcheck="false"></textarea></section><section class="panel terminal"><div class="head">TERMINAL <span class="status" id="status">Ready</span></div><div class="term" id="term"></div><div class="entry" id="entry"><span>&gt;</span><input id="answer" autocomplete="off" spellcheck="false" aria-label="Terminal input"></div></section></main></div><script>const auth=document.getElementById('auth'),app=document.getElementById('app'),access=document.getElementById('access'),answer=document.getElementById('answer'),term=document.getElementById('term'),entry=document.getElementById('entry'),status=document.getElementById('status'),code=document.getElementById('code');document.getElementById('login').onsubmit=e=>{e.preventDefault();if(document.getElementById('pw').value==='ovesh'){auth.classList.add('hidden');access.classList.add('show');setTimeout(()=>{access.classList.remove('show');app.style.display='flex';answer.focus()},1800)}else document.getElementById('msg').textContent='Incorrect password. Try again.'};const qs=[['1. Which loop executes at least once?',['1. for loop','2. while loop','3. do-while loop','4. nested loop'],3,'do-while loop'],['2. Which header file is used for printf() and scanf()?',['1. stdio.h','2. math.h','3. string.h','4. stdlib.h'],1,'stdio.h'],['3. Which data type stores a single character?',['1. int','2. char','3. float','4. double'],2,'char'],['4. Which statement is used for decision making?',['1. for','2. if-else','3. continue','4. return'],2,'if-else'],['5. Which format specifier is used for int?',['1. %f','2. %c','3. %d','4. %s'],3,'%d']];let qi=0,score=0,active=false;function out(s){term.textContent+=s;term.scrollTop=term.scrollHeight}function question(){if(qi>=qs.length){out(`\n--------------------\n      QUIZ RESULT\n--------------------\nYour Point - ${score}/5\nPercentage = ${(score/5*100).toFixed(2)}%\n`);active=false;entry.classList.add('hidden');status.textContent='Finished';return}const q=qs[qi];out(`${qi?'\n':''}${q[0]}\n${q[1].join('\n')}\nEnter your answer - `);answer.value='';answer.focus()}document.getElementById('run').onclick=()=>{qi=0;score=0;active=true;entry.classList.remove('hidden');status.textContent='Running';term.textContent='';out('-----------------\n  C LANGUAGE MINI QUIZ\n-----------------\n\n');question()};answer.onkeydown=e=>{if(e.key!=='Enter'||!active)return;e.preventDefault();const v=answer.value.trim();out(v+'\n');if(!/^[1-4]$/.test(v)){out('Please enter 1, 2, 3, or 4.\nEnter your answer - ');answer.value='';return}const q=qs[qi];if(+v===q[2]){score++;out('Correct!\n')}else out('Wrong! The correct answer is - '+q[3]+'\n');qi++;question()};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(code.value);document.getElementById('clear').onclick=()=>term.textContent='';const root=document.documentElement;let saved=localStorage.getItem('ovesh-ppc-theme')||'dark';root.dataset.theme=saved;document.getElementById('theme').onclick=()=>{saved=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=saved;localStorage.setItem('ovesh-ppc-theme',saved)};code.value=`#include <stdio.h>\n\nint main()\n{\n    int answer, point = 0;\n\n    printf("-----------------\\n");\n    printf("  C LANGUAGE MINI QUIZ\\n");\n    printf("----------------\\n");\n\n    // Question 1\n    printf("\\n1. Which loop executes at least once?\\n");\n    printf("1. for loop\\n");\n    printf("2. while loop\\n");\n    printf("3. do-while loop\\n");\n    printf("4. nested loop\\n");\n    printf("Enter your answer - ");\n    scanf("%d", &answer);\n\n    if (answer == 3) { point++; printf("Correct!\\n"); }\n    else printf("Wrong! The correct answer is - do-while loop\\n");\n\n    return 0;\n}`;</script></body></html>
