<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ovesh PPC — C Compiler</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080a0f;color:#eaf0f6;font-family:system-ui,sans-serif}.app{height:100vh;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #202936;background:#0d1118}.brand{font-weight:800}.brand small{display:block;color:#8290a0;font-size:11px;font-weight:500}.sp{flex:1}.btn{padding:9px 13px;border:1px solid #293444;border-radius:9px;background:#121923;color:#e5edf5;font-weight:700}.run{background:#63e6be;color:#03120d;border-color:#63e6be}.work{flex:1;min-height:0;display:grid;grid-template-columns:60% 40%;grid-template-rows:1fr 270px}.editor{min-width:0;display:flex;flex-direction:column;border-right:1px solid #202936}.head{height:40px;display:flex;align-items:center;padding:0 13px;background:#0d1118;border-bottom:1px solid #202936;font:12px system-ui;color:#cbd5e1}.code{flex:1;width:100%;resize:none;border:0;outline:0;background:#090d13;color:#d8e1ea;padding:17px;font:14px/1.65 Consolas,monospace}.side{display:flex;flex-direction:column;min-height:0}.side textarea{flex:1;margin:12px;resize:none;background:#090d13;color:#fff;border:1px solid #202936;border-radius:8px;padding:12px;font:13px Consolas;outline:0}.terminal{grid-column:1/3;display:flex;flex-direction:column;min-height:0;border-top:1px solid #202936;background:#06090d}.term{flex:1;min-height:0;overflow:auto;padding:14px;font:14px/1.6 Consolas,monospace;white-space:pre-wrap}.entry{display:flex;padding:0 14px 14px;font:14px Consolas,monospace}.entry span{color:#63e6be}.entry input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;margin-left:7px}.auth{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#080a0f}.box{width:min(410px,calc(100% - 30px));padding:28px;border:1px solid #293444;border-radius:20px;background:#0d1118}.box h1{margin:0 0 6px}.box p{color:#8793a2;font-size:13px}.pass{display:flex;gap:8px}.pass input{flex:1;padding:12px;border:1px solid #2b3746;border-radius:10px;background:#090d13;color:#fff;outline:0}.unlock{padding:0 16px;border:0;border-radius:10px;background:#63e6be;font-weight:800}.msg{color:#ff6b7a;font-size:12px;margin-top:9px}.hidden{display:none!important}@media(max-width:800px){.work{grid-template-columns:1fr;grid-template-rows:1fr 150px 250px}.editor{grid-column:1}.side{grid-column:1;grid-row:2}.terminal{grid-column:1;grid-row:3}.btn:not(.run){display:none}}</style></head><body><div class="auth" id="auth"><div class="box"><h1>Ovesh PPC</h1><p>Private Programming Compiler</p><form class="pass" id="login"><input id="pw" type="password" placeholder="Enter password" autofocus><button class="unlock">Unlock</button></form><div class="msg" id="msg"></div></div></div><div class="app" id="app" style="display:none"><header class="top"><div class="brand">Ovesh PPC<small>Online C Compiler</small></div><div class="sp"></div><button class="btn" id="copy">Copy</button><button class="btn" id="clear">Clear</button><button class="btn run" id="run">▶ Run</button></header><main class="work"><section class="editor"><div class="head">● &nbsp; main.c</div><textarea class="code" id="code" spellcheck="false"></textarea></section><aside class="side"><div class="head">PROGRAM INPUT</div><textarea id="stdin" placeholder="For regular C programs, enter stdin here..."></textarea></aside><section class="terminal"><div class="head">TERMINAL <span id="status" style="margin-left:auto;color:#8290a0">Ready</span></div><div class="term" id="term"></div><div class="entry" id="entry"><span>&gt;</span><input id="answer" autocomplete="off" spellcheck="false"></div></section></main></div><script>
const CODE=`#include <stdio.h>\n\nint main()\n{\n    int answer, point = 0;\n\n    printf("-----------------\\n");\n    printf("  C LANGUAGE MINI QUIZ\\n");\n    printf("----------------\\n");\n\n    printf("\\n1. Which loop executes at least once?\\n");\n    printf("1. for loop\\n2. while loop\\n3. do-while loop\\n4. nested loop\\n");\n    printf("Enter your answer - "); scanf("%d", &answer);\n    if(answer==3){point++;printf("Correct!\\n");}else printf("Wrong! The correct answer is - do-while loop\\n");\n\n    printf("\\n2. Which header file is used for printf() and scanf()?\\n");\n    printf("1. stdio.h\\n2. math.h\\n3. string.h\\n4. stdlib.h\\n");\n    printf("Enter your answer - "); scanf("%d", &answer);\n    if(answer==1){point++;printf("Correct!\\n");}else printf("Wrong! The correct answer is - stdio.h\\n");\n\n    printf("\\n3. Which data type stores a single character?\\n");\n    printf("1. int\\n2. char\\n3. float\\n4. double\\n");\n    printf("Enter your answer - "); scanf("%d", &answer);\n    if(answer==2){point++;printf("Correct!\\n");}else printf("Wrong! The correct answer is - char\\n");\n\n    printf("\\n4. Which statement is used for decision making?\\n");\n    printf("1. for\\n2. if-else\\n3. continue\\n4. return\\n");\n    printf("Enter your answer - "); scanf("%d", &answer);\n    if(answer==2){point++;printf("Correct!\\n");}else printf("Wrong! The correct answer is - if-else\\n");\n\n    printf("\\n5. Which format specifier is used for int?\\n");\n    printf("1. %%f\\n2. %%c\\n3. %%d\\n4. %%s\\n");\n    printf("Enter your answer - "); scanf("%d", &answer);\n    if(answer==3){point++;printf("Correct!\\n");}else printf("Wrong! The correct answer is - %%d\\n");\n\n    printf("\\n--------------------\\n      QUIZ RESULT\\n--------------------\\n");\n    printf("Your Point - %d/5\\n",point);\n    printf("Percentage = %.2f%%\\n",(point/5.0)*100);\n    return 0;\n}`;document.getElementById('code').value=CODE;
const auth=document.getElementById('auth'),app=document.getElementById('app');document.getElementById('login').onsubmit=e=>{e.preventDefault();if(document.getElementById('pw').value==='ovesh'){auth.classList.add('hidden');app.style.display='flex';setTimeout(()=>document.getElementById('answer').focus(),50)}else document.getElementById('msg').textContent='Incorrect password. Try again.'};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(document.getElementById('code').value);document.getElementById('clear').onclick=()=>document.getElementById('term').textContent='';
const qs=[['1. Which loop executes at least once?',['1. for loop','2. while loop','3. do-while loop','4. nested loop'],3,'do-while loop'],['2. Which header file is used for printf() and scanf()?',['1. stdio.h','2. math.h','3. string.h','4. stdlib.h'],1,'stdio.h'],['3. Which data type stores a single character?',['1. int','2. char','3. float','4. double'],2,'char'],['4. Which statement is used for decision making?',['1. for','2. if-else','3. continue','4. return'],2,'if-else'],['5. Which format specifier is used for int?',['1. %f','2. %c','3. %d','4. %s'],3,'%d']];let qi=0,score=0,active=false;const term=document.getElementById('term'),input=document.getElementById('answer'),entry=document.getElementById('entry');function out(s){term.textContent+=s;term.scrollTop=term.scrollHeight}function question(){if(qi===qs.length){out(`\n--------------------\n      QUIZ RESULT\n--------------------\nYour Point - ${score}/5\nPercentage = ${(score/5*100).toFixed(2)}%\n`);active=false;entry.classList.add('hidden');document.getElementById('status').textContent='Finished';return}let q=qs[qi];out(`${qi?'\n':''}${q[0]}\n${q[1].join('\n')}\nEnter your answer - `);input.value='';input.focus()}document.getElementById('run').onclick=()=>{qi=0;score=0;active=true;entry.classList.remove('hidden');document.getElementById('status').textContent='Running';term.textContent='';out('-----------------\n  C LANGUAGE MINI QUIZ\n-----------------\n\n');question()};input.onkeydown=e=>{if(e.key!=='Enter'||!active)return;e.preventDefault();let v=input.value.trim();out(v+'\n');if(!/^[1-4]$/.test(v)){out('Please enter 1, 2, 3, or 4.\nEnter your answer - ');input.value='';return}let q=qs[qi];if(+v===q[2]){score++;out('Correct!\n')}else out('Wrong! The correct answer is - '+q[3]+'\n');qi++;question()};
</script></body></html>
