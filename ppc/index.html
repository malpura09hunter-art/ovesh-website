<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ovesh PPC</title><style>html,body{margin:0;height:100%;background:#080a0f;color:#edf2f7;font-family:system-ui}body{overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;padding:0 16px;gap:10px;background:#0d1118;border-bottom:1px solid #202936}.brand{font-weight:800}.sub{font-size:10px;color:#8491a1;display:block}.sp{flex:1}.btn{border:1px solid #283342;background:#121923;color:#dce5ee;border-radius:8px;padding:8px 12px;font-weight:700}.run{background:#63e6be;color:#03120c;border-color:#63e6be}.workspace{flex:1;min-height:0;display:grid;grid-template-columns:60% 40%;grid-template-rows:1fr 48%}.editor{min-width:0;display:flex;flex-direction:column;border-right:1px solid #202936}.head{height:40px;display:flex;align-items:center;padding:0 13px;background:#0d1118;border-bottom:1px solid #202936;font-size:12px;color:#cbd5e1}.code{flex:1;width:100%;resize:none;border:0;outline:0;background:#090d13;color:#d8e1ea;padding:17px;font:14px/1.65 Consolas,monospace}.side{display:flex;flex-direction:column;min-height:0}.side textarea{flex:1;margin:12px;resize:none;background:#090d13;color:#fff;border:1px solid #202936;border-radius:8px;padding:12px;font:13px Consolas;outline:0}.terminal{grid-column:1/3;display:flex;flex-direction:column;min-height:0;border-top:1px solid #202936;background:#06090d}.term{flex:1;min-height:0;overflow:auto;padding:18px;font:14px/1.65 Consolas,monospace;white-space:pre-wrap}.entry{display:flex;padding:0 18px 16px;font:14px Consolas,monospace}.entry span{color:#63e6be}.entry input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;margin-left:7px}.status{margin-left:auto;color:#8290a0;font-size:11px}.auth{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#080a0f}.box{width:min(410px,calc(100% - 30px));padding:28px;border:1px solid #293444;border-radius:20px;background:#0d1118}.box input{width:100%;box-sizing:border-box;padding:12px;margin:15px 0;background:#090d13;color:#fff;border:1px solid #293444;border-radius:9px}.unlock{padding:11px 16px;background:#63e6be;border:0;border-radius:9px;font-weight:800}.msg{color:#ff6b7a;font-size:12px}.hidden{display:none!important}@media(max-width:800px){.workspace{grid-template-columns:1fr;grid-template-rows:35% 15% 50%}.editor{grid-column:1}.side{grid-column:1}.terminal{grid-column:1;grid-row:3}.btn:not(.run){display:none}}</style></head><body><div class="auth" id="auth"><div class="box"><h2>Ovesh PPC</h2><p>Enter password to continue.</p><form id="login"><input id="pw" type="password" placeholder="Password" autofocus><button class="unlock">Unlock</button></form><div class="msg" id="msg"></div></div></div><div class="app" id="app" style="display:none"><header class="top"><div class="brand">Ovesh PPC<span class="sub">Online C Compiler</span></div><div class="sp"></div><button class="btn" id="copy">Copy</button><button class="btn" id="clear">Clear</button><button class="btn run" id="run">▶ Run</button></header><main class="workspace"><section class="editor"><div class="head">● &nbsp; main.c</div><textarea class="code" id="code" spellcheck="false"></textarea></section><aside class="side"><div class="head">PROGRAM INPUT</div><textarea id="stdin" placeholder="For regular C programs, enter stdin here..."></textarea></aside><section class="terminal"><div class="head">TERMINAL <span class="status" id="status">Ready</span></div><div class="term" id="term"></div><div class="entry" id="entry"><span>&gt;</span><input id="answer" autocomplete="off"></div></section></main></div><script>document.getElementById('login').onsubmit=e=>{e.preventDefault();if(pw.value==='ovesh'){auth.classList.add('hidden');app.style.display='flex';answer.focus()}else msg.textContent='Incorrect password. Try again.'};const qs=[['1. Which loop executes at least once?',['1. for loop','2. while loop','3. do-while loop','4. nested loop'],3,'do-while loop'],['2. Which header file is used for printf() and scanf()?',['1. stdio.h','2. math.h','3. string.h','4. stdlib.h'],1,'stdio.h'],['3. Which data type stores a single character?',['1. int','2. char','3. float','4. double'],2,'char'],['4. Which statement is used for decision making?',['1. for','2. if-else','3. continue','4. return'],2,'if-else'],['5. Which format specifier is used for int?',['1. %f','2. %c','3. %d','4. %s'],3,'%d']];let qi=0,score=0,active=false;function out(s){term.textContent+=s;term.scrollTop=term.scrollHeight}function question(){if(qi>=qs.length){out(`\n--------------------\n      QUIZ RESULT\n--------------------\nYour Point - ${score}/5\nPercentage = ${(score/5*100).toFixed(2)}%\n`);active=false;entry.classList.add('hidden');status.textContent='Finished';return}let q=qs[qi];out(`${qi?'\n':''}${q[0]}\n${q[1].join('\n')}\nEnter your answer - `);answer.value='';answer.focus()}run.onclick=()=>{qi=0;score=0;active=true;entry.classList.remove('hidden');status.textContent='Running';term.textContent='';out('-----------------\n  C LANGUAGE MINI QUIZ\n-----------------\n\n');question()};answer.onkeydown=e=>{if(e.key!=='Enter'||!active)return;e.preventDefault();let v=answer.value.trim();out(v+'\n');if(!/^[1-4]$/.test(v)){out('Please enter 1, 2, 3, or 4.\nEnter your answer - ');answer.value='';return}let q=qs[qi];if(+v===q[2]){score++;out('Correct!\n')}else out('Wrong! The correct answer is - '+q[3]+'\n');qi++;question()};copy.onclick=()=>navigator.clipboard.writeText(code.value);clear.onclick=()=>term.textContent='';code.value=`#include <stdio.h>\n\nint main()\n{\n    int answer, point = 0;\n\n    printf("-----------------\\n");\n    printf("  C LANGUAGE MINI QUIZ\\n");\n    printf("----------------\\n");\n\n    printf("\\n1. Which loop executes at least once?\\n");\n    printf("1. for loop\\n2. while loop\\n3. do-while loop\\n4. nested loop\\n");\n    printf("Enter your answer - ");\n    scanf("%d", &answer);\n\n    if(answer == 3) point++;\n    else printf("Wrong! The correct answer is - do-while loop\\n");\n\n    return 0;\n}`;</script></body></html>
