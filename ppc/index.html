<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ovesh PPC — Project Completed</title><style>:root{--bg:#0b1120;--panel:#111827;--text:#f8fafc;--muted:#94a3b8;--accent:#2563eb;--accent2:#4f46e5;--border:#243044}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% 0%,rgba(37,99,235,.16),transparent 45%),var(--bg);color:var(--text);overflow:hidden}.page{min-height:100%;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);padding:46px 34px;text-align:center;border:1px solid var(--border);border-radius:26px;background:rgba(17,24,39,.88);box-shadow:0 25px 90px rgba(0,0,0,.35);animation:in .7s cubic-bezier(.2,.8,.2,1)}.icon{width:72px;height:72px;margin:0 auto 20px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:32px;box-shadow:0 14px 40px rgba(37,99,235,.3);animation:pop .7s cubic-bezier(.2,1.4,.4,1)}h1{margin:0;font-size:30px;letter-spacing:-.8px}p{margin:10px 0 0;color:var(--muted);font-size:14px}.line{width:56px;height:3px;margin:24px auto 0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}@media(max-width:500px){.card{padding:38px 24px}h1{font-size:26px}}</style></head><body><main class="page"><section class="card"><div class="icon">✓</div><h1>Project Completed</h1><p>Ovesh PPC Compiler project has been completed.</p><div class="line"></div></section></main></body></html>
