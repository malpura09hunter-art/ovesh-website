<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ovesh PPC — C Compiler</title>
<style>
:root{--bg:#080a0f;--panel:#0d1118;--panel2:#111722;--line:#202936;--text:#edf2f7;--muted:#8d99a8;--accent:#63e6be;--danger:#ff6b7a;--blue:#6ea8fe}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.topbar{height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(13,17,24,.94);backdrop-filter:blur(18px);z-index:5}.brand{display:flex;align-items:center;gap:10px;min-width:180px}.brandmark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #334155;font-weight:800;color:var(--accent)}.brand b{font-size:15px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:1px}.language{height:38px;padding:0 12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;outline:0}.spacer{flex:1}.btn{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 13px;background:#121923;color:#dce5ee;font-weight:650;transition:.18s}.btn:hover{border-color:#3a4758;transform:translateY(-1px)}.run{background:var(--accent);border-color:var(--accent);color:#04130e;min-width:96px}.run:hover{filter:brightness(1.06)}.run.running{opacity:.7}.workspace{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,40%);grid-template-rows:minmax(0,1fr) 250px}.editor-panel{min-width:0;grid-row:1;grid-column:1;border-right:1px solid var(--line);background:#090d13;display:flex;flex-direction:column}.panelhead{height:42px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);color:#cbd5e1;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:9px;box-shadow:0 0 14px rgba(99,230,190,.5)}#editor{min-height:0;flex:1}.fallback{display:none;width:100%;height:100%;resize:none;border:0;outline:0;background:#090d13;color:#d8e1ea;padding:18px;font:14px/1.65 "SFMono-Regular",Consolas,monospace}.side{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-height:0;background:var(--panel)}.inputwrap{min-height:0;flex:1;display:flex;flex-direction:column}.output{grid-column:1 / 3;grid-row:2;min-height:0;border-top:1px solid var(--line);background:#070a0e;display:flex;flex-direction:column}.outputbody{min-height:0;flex:1;overflow:auto;padding:15px;font:13px/1.6 "SFMono-Regular",Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#d9e2ec}.status{display:flex;gap:15px;align-items:center;margin-left:auto;color:var(--muted);font-size:11px}.ok{color:var(--accent)}.err{color:var(--danger)}textarea#stdin{flex:1;min-height:140px;width:100%;resize:none;border:0;outline:0;background:#0a0e14;color:#d8e1ea;padding:15px;font:13px/1.6 "SFMono-Regular",Consolas,monospace}.hint{padding:10px 14px;border-top:1px solid var(--line);color:#6f7c8b;font-size:11px}.empty{color:#697586}.auth{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#182333 0,#080a0f 55%);display:grid;place-items:center;z-index:50;padding:20px}.auth.hidden{display:none}.authbox{width:min(420px,100%);padding:30px;border:1px solid #283342;border-radius:20px;background:rgba(13,17,24,.9);box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(20px)}.authicon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#101a22;border:1px solid #29433d;color:var(--accent);font-weight:900;margin-bottom:18px}.auth h1{font-size:25px;margin:0 0 7px}.auth p{margin:0 0 22px;color:var(--muted);font-size:13px}.passrow{display:flex;gap:9px}.passrow input{flex:1;height:46px;border:1px solid #2a3544;border-radius:11px;background:#090d13;color:#fff;outline:0;padding:0 13px}.passrow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,230,190,.08)}.unlock{height:46px;padding:0 17px;border:0;border-radius:11px;background:var(--accent);color:#03110c;font-weight:800}.authmsg{min-height:20px;margin-top:11px;font-size:12px;color:var(--danger)}@media(max-width:800px){.topbar{padding:0 10px}.brand{min-width:0}.brand span{display:none}.brand b{font-size:13px}.btn{padding:0 10px}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 190px 230px}.editor-panel{grid-column:1;grid-row:1;border-right:0}.side{grid-column:1;grid-row:2}.output{grid-column:1;grid-row:3}.language{display:none}.status{display:none}}
</style>
</head>
<body>
<div class="auth" id="auth">
  <div class="authbox">
    <div class="authicon">&lt;/&gt;</div>
    <h1>Ovesh PPC</h1>
    <p>Private Programming Compiler · Enter your access password to continue.</p>
    <form class="passrow" id="loginForm">
      <input id="password" type="password" autocomplete="off" placeholder="Enter password" autofocus>
      <button class="unlock" type="submit">Unlock</button>
    </form>
    <div class="authmsg" id="authmsg"></div>
  </div>
</div>
<div class="app" id="app" aria-hidden="true">
<header class="topbar">
  <div class="brand"><div class="brandmark">O</div><div><b>Ovesh PPC</b><span>Online C Compiler</span></div></div>
  <select class="language" aria-label="Language"><option>C — GCC</option></select>
  <div class="spacer"></div>
  <button class="btn" id="copyBtn">Copy</button>
  <button class="btn" id="clearBtn">Clear</button>
  <button class="btn run" id="runBtn">▶ Run</button>
</header>
<main class="workspace">
  <section class="editor-panel">
    <div class="panelhead"><i class="dot"></i>main.c <span class="status" id="editorStatus">Ready</span></div>
    <div id="editor"></div>
    <textarea class="fallback" id="fallbackEditor" spellcheck="false"></textarea>
  </section>
  <aside class="side">
    <div class="panelhead">INPUT <span class="status">stdin</span></div>
    <div class="inputwrap"><textarea id="stdin" spellcheck="false" placeholder="Enter program input here...&#10;Example for the quiz:&#10;3&#10;1&#10;2&#10;2&#10;3"></textarea><div class="hint">One answer per line works with scanf().</div></div>
  </aside>
  <section class="output">
    <div class="panelhead">TERMINAL <span class="status" id="runStatus">Ready</span></div>
    <div class="outputbody" id="output"><span class="empty">Run your C program to see stdout, compiler messages, and runtime errors here.</span></div>
  </section>
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<script>
const CODE = String.raw`#include <stdio.h>

int main()
{
    int answer, point = 0;

    printf("-----------------\n");
    printf("  C LANGUAGE MINI QUIZ\n");
    printf("----------------\n");

    // Question 1
    printf("\n1. Which loop executes at least once?\n");
    printf("1. for loop\n");
    printf("2. while loop\n");
    printf("3. do-while loop\n");
    printf("4. nested loop\n");
    printf("Enter your answer - ");
    scanf("%d", &answer);

    if (answer == 3)
    {
        point++;
        printf("Correct!\n");
    }
    else
    {
        printf("Wrong! The correct answer is - do-while loop\n");
    }

    // Question 2
    printf("\n2. Which header file is used for printf() and scanf()?\n");
    printf("1. stdio.h\n");
    printf("2. math.h\n");
    printf("3. string.h\n");
    printf("4. stdlib.h\n");
    printf("Enter your answer - ");
    scanf("%d", &answer);

    if (answer == 1)
    {
        point++;
        printf("Correct!\n");
    }
    else
    {
        printf("Wrong! The correct answer is - stdio.h\n");
    }

    // Question 3
    printf("\n3. Which data type stores a single character?\n");
    printf("1. int\n");
    printf("2. char\n");
    printf("3. float\n");
    printf("4. double\n");
    printf("Enter your answer - ");
    scanf("%d", &answer);

    if (answer == 2)
    {
        point++;
        printf("Correct!\n");
    }
    else
    {
        printf("Wrong! The correct answer is - char\n");
    }

    // Question 4
    printf("\n4. Which statement is used for decision making?\n");
    printf("1. for\n");
    printf("2. if-else\n");
    printf("3. continue\n");
    printf("4. return\n");
    printf("Enter your answer - ");
    scanf("%d", &answer);

    if (answer == 2)
    {
        point++;
        printf("Correct!\n");
    }
    else
    {
        printf("Wrong! The correct answer is - if-else\n");
    }

    // Question 5
    printf("\n5. Which format specifier is used for int?\n");
    printf("1. %%f\n");
    printf("2. %%c\n");
    printf("3. %%d\n");
    printf("4. %%s\n");
    printf("Enter your answer - ");
    scanf("%d", &answer);

    if (answer == 3)
    {
        point++;
        printf("Correct!\n");
    }
    else
    {
        printf("Wrong! The correct answer is - %%d\n");
    }

    // Result
    printf("\n--------------------\n");
    printf("      QUIZ RESULT\n");
    printf("--------------------\n");

    printf("Your Point - %d/5\n", point);
    printf("Percentage = %.2f%%\n", (point / 5.0) * 100);

    return 0;
}`;

const auth=document.getElementById('auth'),app=document.getElementById('app'),form=document.getElementById('loginForm'),pass=document.getElementById('password'),authmsg=document.getElementById('authmsg');
form.addEventListener('submit',e=>{e.preventDefault();if(pass.value==='ovesh'){sessionStorage.setItem('ovesh_ppc','1');auth.classList.add('hidden');app.setAttribute('aria-hidden','false');pass.value='';setTimeout(()=>window.editor?.layout(),100)}else{authmsg.textContent='Incorrect password. Try again.';pass.select()}});
if(sessionStorage.getItem('ovesh_ppc')==='1'){auth.classList.add('hidden');app.setAttribute('aria-hidden','false')}
let editor,model;
function getCode(){return editor?editor.getValue():document.getElementById('fallbackEditor').value}
function setOutput(text,kind=''){const o=document.getElementById('output');o.textContent=text||'Program finished with no output.';o.className='outputbody '+kind}
require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs'}});
require(['vs/editor/editor.main'],()=>{model=monaco.editor.createModel(CODE,'c');editor=monaco.editor.create(document.getElementById('editor'),{model,theme:'vs-dark',automaticLayout:true,fontSize:14,lineHeight:22,minimap:{enabled:false},padding:{top:14,bottom:14},scrollBeyondLastLine:false,wordWrap:'off',smoothScrolling:true,renderWhitespace:'selection'});window.editor=editor;});
const fallback=document.getElementById('fallbackEditor');fallback.value=CODE;
document.getElementById('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(getCode());const b=document.getElementById('copyBtn');const old=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=old,1000)};
document.getElementById('clearBtn').onclick=()=>{setOutput('');document.getElementById('runStatus').textContent='Ready';document.getElementById('runStatus').className='status'};
document.getElementById('runBtn').onclick=async()=>{const btn=document.getElementById('runBtn'),status=document.getElementById('runStatus'),editorStatus=document.getElementById('editorStatus');btn.disabled=true;btn.classList.add('running');btn.textContent='⏳ Running';status.textContent='Compiling…';status.className='status';editorStatus.textContent='Running';setOutput('Compiling and running your C program…');try{const r=await fetch('/api/ppc-compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:getCode(),stdin:document.getElementById('stdin').value})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||'Compiler service unavailable.');let text='';if(data.stdout)text+=data.stdout;if(data.compile_output)text+=(text?'\n':'')+'[COMPILER]\n'+data.compile_output;if(data.stderr)text+=(text?'\n':'')+'[STDERR]\n'+data.stderr;if(data.message)text+=(text?'\n':'')+'[SYSTEM]\n'+data.message;if(!text)text='Program finished with no output.';setOutput(text,(data.status?.id===3?'':'err'));status.textContent=data.status?.description||'Finished';status.className='status '+(data.status?.id===3?'ok':'err')}catch(err){setOutput(err.message,'err');status.textContent='Error';status.className='status err'}finally{btn.disabled=false;btn.classList.remove('running');btn.textContent='▶ Run';editorStatus.textContent='Ready'}};
window.addEventListener('resize',()=>editor?.layout());
</script>
</body>
</html>
