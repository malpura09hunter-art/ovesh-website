<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OVESH CLOUD™ — Shared File</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050811;color:#eef5ff;display:grid;place-items:center;padding:22px;overflow:hidden}body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 50% 20%,rgba(72,105,255,.18),transparent 34%),radial-gradient(circle at 80% 80%,rgba(0,210,180,.08),transparent 28%);pointer-events:none}.card{position:relative;width:min(620px,100%);padding:34px;border:1px solid rgba(255,255,255,.11);border-radius:28px;background:rgba(10,16,28,.82);backdrop-filter:blur(24px);box-shadow:0 30px 100px rgba(0,0,0,.55)}.brand{font-size:12px;font-weight:850;letter-spacing:.16em;color:#9eb2ce}.brand span{color:#78a9ff}.line{height:1px;background:rgba(255,255,255,.08);margin:26px 0}.file{display:flex;gap:16px;align-items:center}.icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#1d67ff,#5c39d8);font-size:26px;box-shadow:0 12px 35px rgba(52,94,255,.25)}h1{font-size:24px;line-height:1.2;margin:0;word-break:break-word}.sub{margin:6px 0 0;color:#8fa2bd;font-size:13px}.download{display:flex;justify-content:center;align-items:center;width:100%;margin-top:28px;padding:15px 18px;border:0;border-radius:14px;background:linear-gradient(135deg,#4d7cff,#6c48e8);color:white;font-size:14px;font-weight:850;cursor:pointer;text-decoration:none;box-shadow:0 14px 35px rgba(70,92,255,.24)}.download:hover{filter:brightness(1.08);transform:translateY(-1px)}.provider{margin-top:16px;text-align:center;color:#7488a3;font-size:11px}.error{color:#ff9f9f;font-size:14px;text-align:center;padding:20px}.hidden{display:none!important}</style></head><body><main class="card"><div class="brand">OVESH <span>CLOUD</span>™ · SHARED FILE</div><div class="line"></div><div id="content"><div class="file"><div class="icon">↗</div><div><h1 id="name">Preparing file…</h1><p class="sub">Secure external delivery</p></div></div><a id="download" class="download" target="_blank" rel="noopener noreferrer">DOWNLOAD FILE ↗</a><div class="provider">OVESH CLOUD interface · Download delivery by MediaFire</div></div><div id="error" class="error hidden">This sharing link is invalid.</div></main><script>(()=>{const p=new URLSearchParams(location.search),u=p.get('url'),n=p.get('name')||'Shared file',el=document.getElementById('name'),a=document.getElementById('download'),err=document.getElementById('error');el.textContent=n;try{const x=new URL(u||'');if(!/^https?:$/.test(x.protocol)||!/(^|\.)mediafire\.com$/i.test(x.hostname)&&!/(^|\.)mediafire\.com$/i.test(x.hostname.replace(/^download\./i,'')))throw 0;a.href=x.href}catch{document.getElementById('content').classList.add('hidden');err.classList.remove('hidden')}})();</script></body></html>
