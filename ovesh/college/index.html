<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Workspace | OVESH</title><style>:root{--bg:#050805;--panel:#0a120a;--line:#17351b;--g:#39ff14;--t:#d8ffe0;--m:#73917a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#102412,#050805 38%);color:var(--t);font:15px system-ui,Segoe UI,sans-serif;min-height:100vh}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:#050805ee;backdrop-filter:blur(12px);z-index:5}.brand{font-weight:800;letter-spacing:2px;color:var(--g)}.back{color:var(--m);text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:34px 24px}.crumb{color:var(--m);margin-bottom:12px}.crumb span{color:var(--g)}h1{margin:0 0 8px;font-size:32px}p.sub{color:var(--m);margin:0 0 28px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.toolbar button,.toolbar label{border:1px solid var(--line);background:#0a130a;color:var(--t);padding:10px 14px;border-radius:8px;cursor:pointer}.toolbar button:hover,.toolbar label:hover{border-color:var(--g);color:var(--g)}input[type=file]{display:none}.search{margin-left:auto;background:#081008;border:1px solid var(--line);color:var(--t);border-radius:8px;padding:10px 14px;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:linear-gradient(145deg,#0b150b,#071007);border:1px solid var(--line);border-radius:12px;padding:20px;min-height:150px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#2d8f36}.icon{font-size:40px}.name{font-weight:700;margin-top:10px}.meta{font-size:12px;color:var(--m);margin-top:5px}.folder{cursor:pointer}.actions{margin-top:14px;display:flex;gap:7px}.actions button{border:1px solid var(--line);background:#0b160b;color:var(--m);border-radius:6px;padding:6px 9px;cursor:pointer}.empty{color:var(--m);padding:40px;text-align:center;border:1px dashed var(--line);border-radius:12px}.notice{color:#91b798;font-size:13px;margin-top:24px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.box{background:#091109;border:1px solid var(--g);border-radius:12px;padding:24px;width:min(420px,100%)}.box input{width:100%;padding:11px;background:#050905;border:1px solid var(--line);color:white;border-radius:7px;margin:10px 0 16px}.box button{padding:9px 13px;border-radius:7px;border:1px solid var(--line);background:#0c170c;color:var(--t);cursor:pointer}.box .primary{background:var(--g);color:#031003;border-color:var(--g);font-weight:700}@media(max-width:650px){header{padding:0 16px}.wrap{padding:24px 16px}.search{width:100%;margin-left:0}} </style></head><body><header><div class="brand">OVESH // COLLEGE</div><a class="back" href="../">← Back to Workspace</a></header><main class="wrap"><div class="crumb">College / <span id="pathText">Root</span></div><h1>College Files</h1><p class="sub">Organize your college work like a proper file manager.</p><div class="toolbar"><button onclick="goRoot()">⌂ Root</button><button onclick="newFolder()">＋ New Folder</button><label>⬆ Upload Files<input id="upload" type="file" multiple></label><input id="search" class="search" placeholder="Search files and folders…"></div><div id="grid" class="grid"></div><p class="notice">Your folder structure is saved in this browser. The UI is ready for connection to the production storage API.</p></main><div id="modal" class="modal"><div class="box"><h3>New Folder</h3><input id="folderName" placeholder="Folder name"><button onclick="closeModal()">Cancel</button> <button class="primary" onclick="createFolder()">Create</button></div></div><script>const KEY='ovesh_college_workspace_v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{type:'folder',name:'College',children:[{type:'folder',name:'PPC',children:[]},{type:'folder',name:'Web Programming',children:[]}]};let current=data,stack=[];function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){document.getElementById('pathText').textContent=stack.map(x=>x.name).concat(current===data?[]:[current.name]).join(' / ')||'Root';let q=document.getElementById('search').value.toLowerCase(),items=(current.children||[]).filter(x=>x.name.toLowerCase().includes(q)),g=document.getElementById('grid');g.innerHTML='';if(!items.length){g.innerHTML='<div class="empty">No files or folders here yet.<br>Use New Folder or Upload Files to get started.</div>';return}items.forEach((x,i)=>{let c=document.createElement('div');c.className='card '+(x.type==='folder'?'folder':'');if(x.type==='folder'){c.innerHTML='<div class="icon">📁</div><div class="name">'+esc(x.name)+'</div><div class="meta">'+(x.children?.length||0)+' items</div>';c.onclick=()=>{stack.push(current);current=x;document.getElementById('search').value='';render()}}else{c.innerHTML='<div class="icon">📄</div><div class="name">'+esc(x.name)+'</div><div class="meta">'+esc(x.size||'Unknown size')+' · '+esc(x.date||'Uploaded')+'</div><div class="actions"><button onclick="downloadFile('+i+')">Download</button><button onclick="removeFile('+i+')">Delete</button></div>'}g.appendChild(c)})}function goRoot(){current=data;stack=[];render()}function newFolder(){document.getElementById('folderName').value='';document.getElementById('modal').classList.add('open');document.getElementById('folderName').focus()}function closeModal(){document.getElementById('modal').classList.remove('open')}function createFolder(){let n=document.getElementById('folderName').value.trim();if(!n)return;current.children.push({type:'folder',name:n,children:[]});save();closeModal();render()}document.getElementById('upload').onchange=e=>{[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{current.children.push({type:'file',name:f.name,size:format(f.size),date:new Date().toLocaleDateString(),data:r.result,mime:f.type});save();render()};r.readAsDataURL(f)});e.target.value=''};function format(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}function downloadFile(i){let files=current.children.filter(x=>x.type==='file'),f=files[i];if(!f)return;let a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}function removeFile(i){let files=current.children.map((x,n)=>x.type==='file'?n:-1).filter(n=>n>=0),idx=files[i];if(idx!==undefined&&confirm('Delete '+current.children[idx].name+'?')){current.children.splice(idx,1);save();render()}}document.getElementById('search').oninput=render;render();</script></body></html>
