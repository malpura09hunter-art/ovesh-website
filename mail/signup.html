<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Create account — OVESH MAIL</title><style>
:root{--bg:#040706;--card:rgba(10,18,14,.9);--line:rgba(151,255,190,.15);--green:#72ffab;--text:#f2fff5;--muted:#8ea497}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,rgba(114,255,171,.12),transparent 32%),#030504;color:var(--text);font:14px Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(650px,100%);border:1px solid var(--line);border-radius:26px;background:var(--card);backdrop-filter:blur(25px);padding:34px;box-shadow:0 35px 100px #000a}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:3px;color:var(--green)}.step{font:10px monospace;color:var(--muted)}h1{font-size:30px;margin:34px 0 7px}.sub{color:var(--muted);margin-bottom:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:6px;letter-spacing:.7px}.field input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0005;color:var(--text);outline:0}.field input:focus{border-color:rgba(114,255,171,.55)}.avatar{display:flex;gap:12px;align-items:center;padding:12px;border:1px dashed var(--line);border-radius:12px;margin-bottom:15px}.preview{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#102419;color:var(--green);font-weight:900}.full{grid-column:1/-1}.hint{font-size:11px;color:var(--muted);margin-top:5px}.check{display:flex;gap:9px;color:var(--muted);font-size:11px;line-height:1.5;margin:10px 0 17px}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--green),#39df7e);color:#031008;font-weight:900}.google{margin-top:10px;background:#fff08;color:var(--text);border:1px solid var(--line)}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:17px}.foot a{color:var(--green);text-decoration:none}@media(max-width:600px){.card{padding:24px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="/firebase-config.js"></script></head><body><main class="card"><div class="top"><div class="logo">OVESH MAIL</div><div class="step">ACCOUNT SETUP · 01</div></div><h1>Create your account</h1><div class="sub">Build your secure OVESH MAIL identity.</div><div class="avatar"><div class="preview" id="preview">OM</div><div><b>Profile identity</b><div class="hint">Profile photo can be added after account creation.</div></div></div><div class="grid"><div class="field"><label>FULL NAME</label><input id="name" placeholder="Your full name" autocomplete="name"></div><div class="field"><label>COMPANY / ORGANIZATION</label><input id="company" placeholder="Company name" autocomplete="organization"></div><div class="field full"><label>ACCOUNT EMAIL</label><input id="email" type="email" placeholder="Your existing email address" autocomplete="email"><div class="hint">This is the identity used to verify your account until custom OVESH MAIL domain delivery is connected.</div></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="new-password" placeholder="Create a strong password"></div><div class="field"><label>CONFIRM PASSWORD</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat password"></div></div><label class="check"><input type="checkbox" id="terms"> I agree to the OVESH MAIL terms and understand that external Internet mail delivery will be enabled only after the mail infrastructure and domain are configured.</label><button class="btn" id="create">Create OVESH MAIL account</button><button class="btn google" id="google">Continue with Google</button><div class="foot">Already have an account? <a href="login.html">Sign in</a></div></main><script>name.oninput=()=>preview.textContent=(name.value.trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2)||'OM').toUpperCase();create.onclick=async()=>{if(!name.value.trim()||!email.value.trim()||!password.value||password.value!==confirm.value||!terms.checked)return alert('Please complete the required fields and accept the terms.');if(password.value.length<8)return alert('Use a password with at least 8 characters.');create.disabled=true;try{const cred=await auth.createUserWithEmailAndPassword(email.value.trim(),password.value);await cred.user.updateProfile({displayName:name.value.trim()});await db.collection('users').doc(cred.user.uid).set({uid:cred.user.uid,fullName:name.value.trim(),company:company.value.trim(),email:cred.user.email,photoURL:'',provider:'password',emailVerified:false,role:'client',createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastLogin:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await cred.user.sendEmailVerification();await auth.signOut();alert('Account created. Please verify your email, then sign in.');location.href='login.html';}catch(err){alert(friendlyError(err));}finally{create.disabled=false;}};google.onclick=async()=>{google.disabled=true;try{const r=await auth.signInWithPopup(googleProvider);await syncGoogleUserDoc(r.user);location.href='index.html';}catch(err){alert(friendlyError(err));}finally{google.disabled=false;}};</script></body></html>
