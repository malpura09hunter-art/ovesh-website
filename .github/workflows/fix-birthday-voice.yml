name: Fix Birthday Voice
on:
  push:
    paths:
      - '.github/workflows/fix-birthday-voice.yml'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Force correct spoken wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('birthday-edition/index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* OVESH_BIRTHDAY_VOICE_FIX */'
          if marker not in s:
              patch="""<script>/* OVESH_BIRTHDAY_VOICE_FIX */\n(function(){\n  if(!('speechSynthesis' in window)) return;\n  const originalSpeak=window.speechSynthesis.speak.bind(window.speechSynthesis);\n  window.speechSynthesis.speak=function(u){\n    if(u && typeof u.text==='string'){\n      u.text=u.text.replace(/\\bfrom\\s+Ovesh\\b/gi,'to Ovesh');\n    }\n    return originalSpeak(u);\n  };\n})();\n</script>"""
              s=s.replace('</head>',patch+'</head>',1)
              p.write_text(s,encoding='utf-8')
              print('Voice safeguard inserted.')
          else:
              print('Voice safeguard already present.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add birthday-edition/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: ensure birthday voice says to Ovesh'
          git push
