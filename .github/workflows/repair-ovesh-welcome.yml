name: Repair OVESH Cloud Welcome Screen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove welcome interstitial and harden transition
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('oveshcloud/app.js')
          s = app.read_text(encoding='utf-8')

          old = "if(n<=0){clearInterval(window.secTimer);welcome()}"
          new = "if(n<=0){clearInterval(window.secTimer);openApp()}"
          if old in s:
              s = s.replace(old, new, 1)
          s = re.sub(r"function welcome\(\)\{.*?\}", "function welcome(){openApp()}", s, count=1)
          app.write_text(s, encoding='utf-8')

          idx = Path('oveshcloud/index.html')
          h = idx.read_text(encoding='utf-8')

          # Remove the complete welcome interstitial while keeping login/security/app views intact.
          pattern = r'\s*<div id="welcomeView"[^>]*>\s*<div class="welcome-card">.*?</div>\s*</div>\s*</div>'
          h2, n = re.subn(pattern, '\n', h, count=1, flags=re.S)
          if n == 0:
              # Fallback for the exact known markup if whitespace differs.
              start = h.find('<div id="welcomeView"')
              if start >= 0:
                  end = h.find('</div>', h.find('</div>', h.find('<div class="welcome-card"', start) + 1) + 1)
                  if end >= 0:
                      h2 = h[:start] + '\n' + h[end+6:]

          # The interstitial is gone, so its transition helper must not be loaded.
          h2 = re.sub(r'\s*<script[^>]+welcome-transition-fix-v2\.js[^>]*></script>', '', h2, flags=re.I)
          h2 = h2.replace('/oveshcloud/app.js?v=1.1.1', '/oveshcloud/app.js?v=1.1.2')
          idx.write_text(h2, encoding='utf-8')

          # Remove this one-shot repair workflow after it has done its job.
          Path('.github/workflows/repair-ovesh-welcome.yml').unlink(missing_ok=True)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oveshcloud/app.js oveshcloud/index.html .github/workflows/repair-ovesh-welcome.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove OVESH Cloud welcome screen and open workspace directly"
          git push
