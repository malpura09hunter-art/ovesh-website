name: Birthday gift upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade birthday gift reveal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('birthday-edition/index.html')
          s=p.read_text()
          old='''<div class="message"><small>A note from Ovesh</small><strong>For you.</strong></div>'''
          new='''<div class="message"><small>A note from Ovesh</small><strong>What’s the gift?</strong><span class="gift-answer">80% OFF at Ovesh Malpura Cyber Labs.</span></div>'''
          if old in s:
              s=s.replace(old,new,1)
          css='''<style id="birthday-gift-upgrade">.gift-answer{display:block;margin:13px auto 0;max-width:280px;font:600 14px/1.35 'Space Grotesk';letter-spacing:-.01em;color:#ad8541}.box.open .message strong{font-size:36px}.box.open .gift-answer{animation:giftAnswer .8s .18s both}@keyframes giftAnswer{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}@media(max-width:850px){.gift-answer{font-size:12px;max-width:230px}.box.open .message strong{font-size:28px}}</style>'''
          if 'id="birthday-gift-upgrade"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          oldjs='''const open=()=>b.classList.toggle('open');'''
          newjs='''const open=()=>{b.classList.toggle('open');if(b.classList.contains('open')){const r=document.getElementById('gift');if(r) r.setAttribute('aria-label','Birthday gift: 80% off at Ovesh Malpura Cyber Labs')}};'''
          if oldjs in s:
              s=s.replace(oldjs,newjs,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add birthday-edition/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update birthday gift reveal to 80 percent offer"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/birthday-gift-upgrade.yml || true
          git commit -m "Remove temporary birthday upgrade workflow" || true
          git push || true
