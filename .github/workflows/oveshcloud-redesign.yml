name: Ovesh Cloud Premium Redesign
on:
  push:
    branches: [agent/oveshcloud]
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ovesh Cloud-only visual layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          css=r'''<style id="ovesh-cloud-premium-layer">
          :root{--oc-bg:#050713;--oc-panel:rgba(14,18,32,.72);--oc-panel2:rgba(20,25,44,.82);--oc-line:rgba(255,255,255,.095);--oc-white:#f7f9ff;--oc-muted:#8993ab;--oc-blue:#6f8cff;--oc-cyan:#54ddff;--oc-purple:#9a70ff;--oc-green:#5ee6aa}
          html,body{background:var(--oc-bg)!important}body{min-height:100vh;background:radial-gradient(900px 600px at 78% -8%,rgba(93,115,255,.22),transparent 62%),radial-gradient(700px 520px at 28% 15%,rgba(112,68,255,.13),transparent 62%),radial-gradient(800px 600px at 90% 85%,rgba(45,214,255,.09),transparent 65%),#050713!important;color:var(--oc-white)!important}
          body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 90%);animation:ocGrid 18s linear infinite}
          body:after{content:"";position:fixed;width:520px;height:520px;left:42%;top:12%;border-radius:50%;background:radial-gradient(circle,rgba(92,122,255,.13),transparent 68%);filter:blur(20px);pointer-events:none;z-index:-1;animation:ocAtmosphere 12s ease-in-out infinite}
          .sidebar{width:268px!important;padding:20px 14px!important;background:linear-gradient(180deg,rgba(8,11,22,.92),rgba(5,7,15,.82))!important;border-right:1px solid rgba(255,255,255,.085)!important;box-shadow:24px 0 80px rgba(0,0,0,.25)!important}
          .brand{padding:8px 10px 30px!important}.brandmark{width:42px!important;height:42px!important;border-radius:14px!important;background:radial-gradient(circle at 32% 25%,#dce4ff 0,#879eff 18%,#6d58f5 58%,#32237f 100%)!important;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 12px 40px rgba(105,116,255,.34)!important;animation:ocPulse 4s ease-in-out infinite}.brand strong{font-size:18px!important}.navlabel{margin-top:8px!important;color:#626d86!important}.navbtn{padding:12px 13px!important;border-radius:14px!important;color:#8994ab!important;position:relative;overflow:hidden}.navbtn:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(110,139,255,.16),transparent 70%);opacity:0;transition:.3s}.navbtn:hover{background:rgba(255,255,255,.045)!important;color:#fff!important;transform:translateX(4px)!important}.navbtn:hover:after,.navbtn.active:after{opacity:1}.navbtn.active{background:linear-gradient(100deg,rgba(104,129,255,.19),rgba(111,77,255,.08))!important;color:#fff!important;box-shadow:inset 3px 0 0 #718cff,0 10px 30px rgba(65,83,190,.12)!important}.ico{font-size:17px!important}.secure{margin:14px 4px!important;border-radius:18px!important;padding:16px!important;background:linear-gradient(135deg,rgba(71,229,164,.075),rgba(100,126,255,.09))!important;border-color:rgba(111,225,188,.14)!important;box-shadow:inset 0 1px rgba(255,255,255,.05)}
          .main{grid-column:2!important}.topbar{height:78px!important;padding:0 38px!important;background:rgba(5,7,17,.66)!important;border-bottom:1px solid rgba(255,255,255,.07)!important}.search{height:44px!important;width:min(410px,36vw)!important;border-radius:15px!important;background:rgba(255,255,255,.045)!important;border-color:rgba(255,255,255,.09)!important;box-shadow:inset 0 1px rgba(255,255,255,.04)}.search:focus-within{border-color:rgba(111,140,255,.65)!important;box-shadow:0 0 0 4px rgba(111,140,255,.09),0 12px 40px rgba(36,48,118,.18)!important}.topbtn{border-radius:14px!important;background:linear-gradient(135deg,rgba(111,140,255,.18),rgba(154,112,255,.1))!important;border-color:rgba(126,147,255,.22)!important}.topbtn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(80,100,210,.18)}.avatar{width:42px!important;height:42px!important;border-radius:14px!important;box-shadow:0 0 0 2px rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.3)}
          .content{max-width:1580px!important;padding:34px 38px 80px!important}.hero{margin-bottom:30px!important}.eyebrow{color:#7784a0!important;letter-spacing:2.1px!important}.hero h1{font-size:48px!important;letter-spacing:-2.6px!important;line-height:.98!important;text-shadow:0 8px 40px rgba(92,112,255,.16)}.hero p{font-size:14px!important;color:#9ba5bb!important}.heroActions{gap:11px!important}.primary{border-radius:14px!important;padding:13px 18px!important;background:linear-gradient(135deg,#718fff 0%,#8a63ff 100%)!important;box-shadow:0 12px 34px rgba(101,105,255,.25),inset 0 1px rgba(255,255,255,.24)!important}.primary:hover{transform:translateY(-3px)!important;box-shadow:0 18px 44px rgba(101,105,255,.35)!important}.ghost{border-radius:14px!important;background:rgba(255,255,255,.035)!important}
          .metrics{grid-template-columns:repeat(4,1fr)!important;gap:14px!important}.card{border-radius:24px!important;background:linear-gradient(145deg,rgba(19,24,42,.78),rgba(9,12,23,.88))!important;border-color:rgba(255,255,255,.085)!important;box-shadow:0 24px 70px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.035)!important;backdrop-filter:blur(20px)!important}.card:before{background:linear-gradient(125deg,rgba(255,255,255,.065),transparent 34%)!important}.metric{min-height:142px!important;padding:21px!important;transition:.35s cubic-bezier(.2,.8,.2,1)}.metric:hover{transform:translateY(-5px);border-color:rgba(117,140,255,.25)!important;box-shadow:0 28px 70px rgba(0,0,0,.3),0 0 35px rgba(84,106,255,.07)!important}.metricIcon{width:36px!important;height:36px!important;border-radius:12px!important;background:linear-gradient(145deg,rgba(111,140,255,.18),rgba(154,112,255,.08))!important}.metricValue{font-size:33px!important;margin-top:19px!important}.metricFoot{color:#707b93!important}
          .mainGrid{gap:14px!important}.projectHero{min-height:330px!important;grid-template-columns:1.08fr .92fr!important}.projectInfo{padding:31px!important}.projectInfo h2{font-size:34px!important;letter-spacing:-1.5px!important}.projectInfo p{font-size:13px!important;max-width:520px!important}.projectVisual{min-height:330px!important;background:radial-gradient(circle at 50% 46%,rgba(110,133,255,.43),transparent 29%),radial-gradient(circle at 70% 30%,rgba(155,103,255,.2),transparent 30%),linear-gradient(145deg,#111a35,#070a15)!important}.projectVisual:before{content:"OVESH CLOUD™";position:absolute;z-index:2;top:22px;right:24px;color:rgba(225,232,255,.42);font-size:9px;font-weight:800;letter-spacing:2.4px}.orb{width:190px!important;height:190px!important;background:radial-gradient(circle at 32% 25%,#eef2ff 0,#aebcff 12%,#718cff 30%,rgba(111,87,230,.65) 56%,transparent 72%)!important;box-shadow:0 0 100px rgba(106,126,255,.42),0 0 220px rgba(93,71,218,.18)!important;animation:ocFloat 6s ease-in-out infinite!important}.ring{width:270px!important;height:82px!important;border-color:rgba(151,171,255,.55)!important;box-shadow:0 0 40px rgba(107,129,255,.15)!important;animation:ocSpin 13s linear infinite!important}.ring.r2{width:325px!important;height:110px!important;animation-duration:19s!important}.panel{padding:24px!important}.panelTitle{font-size:17px!important}.storage{gap:25px!important}.donut{width:154px!important;height:154px!important;background:conic-gradient(#718fff 0 42%,#9a70ff 42% 68%,#54ddff 68% 81%,#20283b 81% 100%)!important;box-shadow:0 0 45px rgba(94,118,255,.1)}.donut:after{background:#0d1220!important;inset:13px!important}.donutText{font-size:26px!important}.srow{padding:11px 0!important}
          .activity{gap:14px!important}.chart{height:205px!important}.chartLabel{padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.035)}.line{stroke-width:3.5!important}.activityItem{padding:15px 0!important}.fileIcon{width:38px!important;height:38px!important;border-radius:12px!important;background:linear-gradient(145deg,rgba(111,140,255,.17),rgba(154,112,255,.08))!important}.status{font-weight:700}
          .projects{gap:14px!important}.projectCard{min-height:174px!important;padding:20px!important;border-radius:22px!important;transition:.4s cubic-bezier(.2,.8,.2,1)!important}.projectCard:hover{transform:translateY(-7px) scale(1.01)!important;border-color:rgba(115,141,255,.34)!important;box-shadow:0 30px 70px rgba(0,0,0,.34),0 0 40px rgba(90,108,255,.08)!important}.clientLogo{width:44px!important;height:44px!important;border-radius:14px!important;background:linear-gradient(145deg,#293b72,#171b35)!important;box-shadow:inset 0 1px rgba(255,255,255,.1)}.pill{padding:6px 9px!important;background:rgba(83,224,160,.08)!important}.projectCard h3{font-size:17px!important;margin:20px 0 7px!important}.projectCard p{font-size:11px!important;color:#8d97ad!important}.progress{height:6px!important;background:#1b2234!important;margin-top:20px!important}.progress i{background:linear-gradient(90deg,#718fff,#54ddff)!important;box-shadow:0 0 14px rgba(84,221,255,.2)}
          .sectionTitle{font-size:32px!important;letter-spacing:-1.3px!important}.toolbar{margin:24px 0!important}.input{height:46px!important;border-radius:14px!important;background:rgba(255,255,255,.04)!important}.fileGrid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))!important;gap:14px!important}.fileCard{min-height:165px!important;padding:20px!important;border-radius:21px!important;transition:.35s!important}.fileCard:hover{transform:translateY(-6px)!important;border-color:rgba(111,140,255,.3)!important;box-shadow:0 25px 60px rgba(0,0,0,.3)!important}.fileType{font-size:29px!important}.emptyState{padding:70px 20px!important;background:rgba(255,255,255,.018)!important}
          .modalWrap{background:rgba(1,3,10,.72)!important}.modal{background:linear-gradient(145deg,#151b2d,#0b0f1c)!important;border-color:rgba(255,255,255,.12)!important;border-radius:26px!important;box-shadow:0 35px 100px rgba(0,0,0,.55),0 0 60px rgba(75,91,200,.12)!important}.toast{background:linear-gradient(145deg,#161d31,#0d1220)!important;border-radius:16px!important}
          @keyframes ocGrid{to{transform:translate3d(44px,44px,0)}}@keyframes ocAtmosphere{0%,100%{transform:translate3d(-3%,0,0) scale(1)}50%{transform:translate3d(5%,4%,0) scale(1.08)}}@keyframes ocPulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.14),0 12px 40px rgba(105,116,255,.28)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.2),0 14px 55px rgba(105,116,255,.46)}}@keyframes ocFloat{0%,100%{transform:translate(-50%,-50%) translateY(0) scale(1)}50%{transform:translate(-50%,-50%) translateY(-14px) scale(1.035)}}@keyframes ocSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
          @media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)!important}.projectHero{grid-template-columns:1fr!important}.projectVisual{min-height:270px!important}}
          @media(max-width:760px){.sidebar{width:282px!important}.topbar{padding:0 16px!important}.content{padding:24px 16px 55px!important}.hero h1{font-size:37px!important}.metrics{grid-template-columns:1fr 1fr!important}.projectVisual{min-height:235px!important}.projectHero{min-height:0!important}.projectInfo{padding:24px!important}.panel{padding:19px!important}.fileGrid{grid-template-columns:1fr 1fr!important}}
          @media(max-width:420px){.metrics{grid-template-columns:1fr!important}.fileGrid{grid-template-columns:1fr!important}.hero h1{font-size:33px!important}}
          @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
          </style>'''
          if 'id="ovesh-cloud-premium-layer"' in s:
              import re
              s=re.sub(r'<style id="ovesh-cloud-premium-layer">.*?</style>',css,s,flags=re.S)
          else:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit isolated dashboard change
        run: |
          git config user.name "Ovesh Cloud Design Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "feat(oveshcloud): premium nebula dashboard experience"
          git push
