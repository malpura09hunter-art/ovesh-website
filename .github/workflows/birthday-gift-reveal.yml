name: Birthday gift reveal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Add cinematic gift reveal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('birthday-edition/index.html')
          s=p.read_text()
          css='''<style id="cinematic-gift-reveal">.gift-reveal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;text-align:center;background:rgba(246,244,238,.96);opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.02);transition:opacity .35s ease,visibility .35s ease,transform .7s cubic-bezier(.2,.85,.2,1)}#welcome.gift-revealing .gift-reveal{opacity:1;visibility:visible;transform:none}.gift-reveal-inner{transform:translateY(20px);opacity:0}.gift-revealing .gift-reveal-inner{animation:giftRevealIn .75s cubic-bezier(.2,.85,.2,1) .08s forwards}.gift-question{font:700 9px 'Space Grotesk';letter-spacing:.5em;color:#777;text-transform:uppercase}.gift-percent{font:700 clamp(100px,22vw,300px)/.72 'Space Grotesk';letter-spacing:-.14em;margin:18px 0;color:#0a0a0a}.gift-percent span{color:#ad8541}.gift-line{font:500 clamp(18px,3vw,38px)/1.1 'Playfair Display';font-style:italic}.gift-brand{margin-top:22px;font:700 9px 'Space Grotesk';letter-spacing:.3em;color:#777;text-transform:uppercase}.gift-reveal .gold-line{width:70px;height:1px;background:#ad8541;margin:22px auto}@keyframes giftRevealIn{to{opacity:1;transform:none}}@media(max-width:850px){.gift-percent{font-size:25vw}.gift-question{font-size:7px;letter-spacing:.36em}.gift-line{font-size:7vw}.gift-brand{font-size:7px;letter-spacing:.2em}}@media(prefers-reduced-motion:reduce){.gift-reveal,.gift-reveal-inner{transition:none!important;animation:none!important}.gift-revealing .gift-reveal-inner{opacity:1;transform:none}}</style>'''
          if 'id="cinematic-gift-reveal"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          marker='''<div class="welcome-center"><div class="micro">WELCOME TO</div>'''
          replacement='''<div class="gift-reveal" aria-live="polite"><div class="gift-reveal-inner"><div class="gift-question">WHAT’S THE GIFT?</div><div class="gift-percent"><span>80</span>%</div><div class="gold-line"></div><div class="gift-line">Off at Ovesh Malpura Cyber Labs.</div><div class="gift-brand">Birthday Edition · 2026 · A gift from Ovesh</div></div></div><div class="welcome-center"><div class="micro">WELCOME TO</div>'''
          if 'class="gift-reveal"' not in s and marker in s:
              s=s.replace(marker,replacement,1)
          old='''function enter(){if(welcomed)return;welcomed=true;speak();w.classList.add('hide');setTimeout(()=>{document.body.style.overflowX='hidden'},1500)}'''
          new='''function enter(){if(welcomed)return;welcomed=true;if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("What’s the gift? Eighty percent off at Ovesh Malpura Cyber Labs. Happy birthday from Ovesh.");u.lang='en-IN';u.rate=.88;u.pitch=1.08;u.volume=1;const voices=window.speechSynthesis.getVoices();const female=voices.find(v=>/en-IN|en-GB|en-US/i.test(v.lang)&&/female|samantha|ava|serena|karen|moira|victoria|zira/i.test(v.name));if(female)u.voice=female;window.speechSynthesis.speak(u)}w.classList.add('gift-revealing');setTimeout(()=>{w.classList.add('welcome-exit');document.body.classList.add('birthday-entering');setTimeout(()=>{w.classList.add('hide');document.body.style.overflowX='hidden'},1150)},2600)}'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add birthday-edition/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add cinematic 80 percent birthday gift reveal"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/birthday-gift-reveal.yml || true
          git commit -m "Remove temporary birthday gift workflow" || true
          git push || true
