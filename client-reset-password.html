<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Reset Client Password — OV CLOUD</title>
<style>
:root{color-scheme:dark;--line:rgba(86,207,232,.24);--cyan:#42d7e8;--muted:#9eb2c6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#10334a 0,transparent 55%),linear-gradient(145deg,#050b14,#071827 60%,#04111c);color:#e9f7ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:32px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,rgba(12,31,48,.97),rgba(5,17,29,.98));box-shadow:0 24px 90px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#0b2c3b;color:var(--cyan);font-weight:800}.brand strong{display:block;font-size:17px;letter-spacing:.03em}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:12px}h1{margin:0 0 10px;font-size:27px;letter-spacing:-.04em}p{color:var(--muted);font-size:14px;line-height:1.65}label{display:block;margin:20px 0 6px;color:#b9cfdf;font-size:11px;font-weight:700;letter-spacing:.08em}input{width:100%;padding:13px 14px;border:1px solid #244359;border-radius:9px;background:#071522;color:#effaff;font-size:14px;outline:none}input:focus{border-color:var(--cyan)}button,.link{width:100%;display:flex;justify-content:center;align-items:center;gap:9px;padding:13px 16px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}.primary{border:0;background:var(--cyan);color:#03202b;margin-top:16px}.secondary{border:1px solid var(--line);background:transparent;color:#d7edf8;margin-top:10px}.status{display:none;margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#0b2434;color:#c8f7fb;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.status.show{display:block}.status.error{border-color:#8c4545;background:#29151b;color:#ffd7d7}.foot{text-align:center;margin-top:22px;font-size:11px;color:#718ba0}button:disabled{opacity:.6;cursor:wait}@media(max-width:420px){.card{padding:24px}}
</style>
</head>
<body>
<main class="card">
<div class="brand"><div class="mark">OC</div><div><strong>OV <span style="color:var(--cyan)">CLOUD</span>™</strong><small>Secure Client Portal</small></div></div>
<h1>Forgot password?</h1>
<p>Enter the email address associated with your client account. If an eligible account exists, Firebase will send password-reset instructions.</p>
<form id="resetForm">
<label for="email">CLIENT EMAIL ADDRESS</label>
<input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
<button id="sendBtn" class="primary" type="submit">Send reset instructions →</button>
</form>
<div id="status" class="status" role="status" aria-live="polite"></div>
<a class="link secondary" href="/client-login.html">← Back to client login</a>
<div class="foot">PRIVATE ACCESS · MALPURA CYBER LABS</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="/firebase-config.js"></script>
<script>
(function(){
 const form=document.getElementById('resetForm'),email=document.getElementById('email'),button=document.getElementById('sendBtn'),status=document.getElementById('status');
 function show(text,error){status.textContent=text;status.classList.add('show');status.classList.toggle('error',!!error)}
 form.addEventListener('submit',async function(event){
  event.preventDefault();button.disabled=true;status.classList.remove('show','error');
  try{
   await auth.sendPasswordResetEmail(email.value.trim(),{url:location.origin+'/client-login.html',handleCodeInApp:false});
   show('If an account is registered with that email, reset instructions will be sent. Check your inbox and spam folder.');
  }catch(error){
   console.error('Client password reset request failed:',error.code||error.message);
   if(error.code==='auth/invalid-email')show('Enter a valid email address.',true);
   else if(error.code==='auth/too-many-requests')show('Too many requests. Please wait a while before trying again.',true);
   else if(error.code==='auth/quota-exceeded')show('Password-reset email quota is currently exhausted. Please contact the cloud owner or try later.',true);
   else show('We could not send reset instructions right now. Please try again later or contact the cloud owner.',true);
  }finally{button.disabled=false}
 });
})();
</script>
</body>
</html>
