<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login | OveshMalpura Cyber Labs</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030a03; --bg2: #060f06; --bg3: #0a160a;
  --neon: #00ff41; --neon2: #00cc33; --neon3: #39ff14; --dim: #00aa22;
  --text: #c8ffd4; --muted: #4a7a52;
  --card: rgba(0,255,65,0.04); --border: rgba(0,255,65,0.15);
  --glow: 0 0 20px rgba(0,255,65,0.4), 0 0 60px rgba(0,255,65,0.1);
  --error: #ff4455;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; position: relative; overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(0,255,65,0.06) 1px, transparent 1px);
  background-size: 24px 24px; pointer-events: none;
}
.logo-link { position: absolute; top: 28px; left: 28px; font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--neon3); text-decoration: none; letter-spacing: 2px; font-size: 15px; text-shadow: 0 0 10px rgba(0,255,65,0.4); }
.card {
  width: 100%; max-width: 420px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 40px 32px; box-shadow: var(--glow); position: relative; z-index: 1;
}
.eyebrow { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; color: var(--neon3); margin-bottom: 24px; }
.tabs { display: flex; gap: 4px; margin-bottom: 24px; background: rgba(0,255,65,0.03); border-radius: 8px; padding: 4px; }
.tab-btn { flex: 1; background: none; border: none; color: var(--muted); font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 15px; padding: 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
.tab-btn.active { background: rgba(0,255,65,0.1); color: var(--neon3); }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-family: 'Share Tech Mono', monospace; letter-spacing: 1px; }
.field input {
  width: 100%; background: rgba(0,255,65,0.03); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 14px; color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 16px; outline: none; transition: border-color 0.2s;
}
.field input:focus { border-color: var(--neon2); box-shadow: 0 0 0 3px rgba(0,255,65,0.08); }
.btn-primary {
  width: 100%; background: var(--neon2); color: #021002; border: none; border-radius: 6px;
  padding: 13px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px;
  cursor: pointer; transition: all 0.2s; text-transform: uppercase;
}
.btn-primary:hover { background: var(--neon3); box-shadow: var(--glow); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.link-row { display: flex; justify-content: space-between; margin-top: 14px; font-size: 14px; }
.link-row a, .link-row button { color: var(--dim); text-decoration: none; background: none; border: none; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-size: 14px; }
.link-row a:hover, .link-row button:hover { color: var(--neon3); }
.msg { padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; display: none; }
.msg.error { background: rgba(255,68,85,0.1); border: 1px solid rgba(255,68,85,0.3); color: var(--error); display: block; }
.msg.success { background: rgba(0,255,65,0.08); border: 1px solid var(--border); color: var(--neon3); display: block; }
.pane { display: none; }
.pane.active { display: block; }

.divider-row { display: flex; align-items: center; gap: 12px; margin: 18px 0; }
.divider-row::before, .divider-row::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.divider-row span { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 2px; }

.btn-google {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: #ffffff; color: #3c4043; border: 1px solid #dadce0; border-radius: 6px;
  padding: 12px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 15px;
  cursor: pointer; transition: box-shadow 0.2s, background 0.2s; position: relative;
}
.btn-google:hover { box-shadow: 0 1px 6px rgba(0,0,0,0.35); background: #f8f8f8; }
.btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-google .g-icon { width: 18px; height: 18px; flex-shrink: 0; }
.btn-google .spinner {
  width: 16px; height: 16px; border: 2px solid #dadce0; border-top-color: #3c4043;
  border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
}
.btn-google.loading .g-icon { display: none; }
.btn-google.loading .btn-google-label { display: none; }
.btn-google.loading .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<a href="index.html" class="logo-link">← OVESH MALPURA CYBER LABS</a>

<div class="card">
  <div class="eyebrow">Client Portal</div>
  <h1 id="heading">Welcome Back</h1>

  <div class="tabs">
    <button class="tab-btn active" data-pane="login-pane" onclick="switchTab('login-pane', this)">Login</button>
    <button class="tab-btn" data-pane="signup-pane" onclick="switchTab('signup-pane', this)">Create Account</button>
  </div>

  <div class="msg" id="formMsg"></div>

  <!-- LOGIN -->
  <div class="pane active" id="login-pane">
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" required autocomplete="current-password"></div>
      <button class="btn-primary" type="submit">Log In</button>
      <div class="link-row">
        <button type="button" onclick="switchTab('reset-pane', document.querySelector('.tab-btn'))">Forgot password?</button>
        <span></span>
      </div>
    </form>
    <div class="divider-row"><span>OR</span></div>
    <button type="button" class="btn-google" id="googleBtnLogin" onclick="handleGoogleSignIn(this)">
      <svg class="g-icon" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.3C29.3 35.4 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.3C40.9 36 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      <span class="spinner"></span>
      <span class="btn-google-label">Continue with Google</span>
    </button>
  </div>

  <!-- SIGNUP -->
  <div class="pane" id="signup-pane">
    <form id="signupForm">
      <div class="field"><label>Full Name</label><input type="text" id="signupName" required autocomplete="name"></div>
      <div class="field"><label>Email</label><input type="email" id="signupEmail" required autocomplete="email"></div>
      <div class="field"><label>Password (min 6 characters)</label><input type="password" id="signupPassword" required minlength="6" autocomplete="new-password"></div>
      <button class="btn-primary" type="submit">Create Account</button>
    </form>
    <div class="divider-row"><span>OR</span></div>
    <button type="button" class="btn-google" id="googleBtnSignup" onclick="handleGoogleSignIn(this)">
      <svg class="g-icon" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.3C29.3 35.4 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.3C40.9 36 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      <span class="spinner"></span>
      <span class="btn-google-label">Continue with Google</span>
    </button>
  </div>

  <!-- RESET -->
  <div class="pane" id="reset-pane">
    <div class="eyebrow" style="margin-bottom:16px;">We'll email you a reset link</div>
    <form id="resetForm">
      <div class="field"><label>Email</label><input type="email" id="resetEmail" required autocomplete="email"></div>
      <button class="btn-primary" type="submit">Send Reset Link</button>
      <div class="link-row"><button type="button" onclick="switchTab('login-pane', document.querySelector('.tab-btn'))">← Back to login</button><span></span></div>
    </form>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function switchTab(paneId, btn) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById(paneId).classList.remove ? document.getElementById(paneId).classList.add('active') : null;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (paneId === 'login-pane' || paneId === 'signup-pane') {
    document.querySelector(`.tab-btn[data-pane="${paneId}"]`).classList.add('active');
  }
  document.getElementById('formMsg').className = 'msg';
  const titles = { 'login-pane': 'Welcome Back', 'signup-pane': 'Create Your Account', 'reset-pane': 'Reset Password' };
  document.getElementById('heading').textContent = titles[paneId];
}

function showMsg(text, type) {
  const el = document.getElementById('formMsg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

function setFormsDisabled(disabled) {
  document.querySelectorAll('button, input').forEach(el => el.disabled = disabled);
}

// Redirect if already logged in
auth.onAuthStateChanged(user => {
  if (user) window.location.href = 'dashboard.html';
});

// Catch the result of a redirect-based Google sign-in (popup fallback).
// Runs harmlessly on every page load; resolves to null if no redirect occurred.
auth.getRedirectResult().then(async (result) => {
  if (result && result.user) {
    await syncGoogleUserDoc(result.user);
    window.location.href = 'dashboard.html';
  }
}).catch(err => {
  if (err.code !== 'auth/no-auth-event') showMsg(friendlyError(err), 'error');
});

async function handleGoogleSignIn(btn) {
  showMsg('', ''); // clear
  document.getElementById('formMsg').className = 'msg';
  btn.classList.add('loading');
  setFormsDisabled(true);
  try {
    let result;
    try {
      result = await auth.signInWithPopup(googleProvider);
    } catch (popupErr) {
      // Popup blocked by the browser — gracefully fall back to redirect flow
      if (popupErr.code === 'auth/popup-blocked') {
        await auth.signInWithRedirect(googleProvider);
        return; // page will navigate away; getRedirectResult() picks it up on return
      }
      // User closed the popup or a duplicate request was cancelled — not a real error
      if (popupErr.code === 'auth/popup-closed-by-user' || popupErr.code === 'auth/cancelled-popup-request') {
        return;
      }
      throw popupErr;
    }
    await syncGoogleUserDoc(result.user);
    window.location.href = 'dashboard.html';
  } catch (err) {
    showMsg(friendlyError(err), 'error');
  } finally {
    btn.classList.remove('loading');
    setFormsDisabled(false);
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const submitBtn = e.target.querySelector('button[type=submit]');
  submitBtn.disabled = true;
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    // Sync lastLogin + emailVerified — don't block redirect if this fails
    db.collection('users').doc(cred.user.uid).set({
      lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
      emailVerified: cred.user.emailVerified
    }, { merge: true }).catch(err => console.warn('Could not sync lastLogin:', err.message));
    window.location.href = 'dashboard.html';
  } catch (err) {
    showMsg(friendlyError(err), 'error');
    submitBtn.disabled = false;
  }
});

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    await db.collection('users').doc(cred.user.uid).set({
      uid: cred.user.uid,
      fullName: name,
      email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
      emailVerified: false,
      role: 'client'
    });
    await cred.user.sendEmailVerification();
    showMsg('Account created! A verification email has been sent to ' + email + '.', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 1800);
  } catch (err) {
    showMsg(friendlyError(err), 'error');
  }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('resetEmail').value;
  try {
    await auth.sendPasswordResetEmail(email);
    showMsg('Password reset email sent to ' + email + '. Check your inbox.', 'success');
  } catch (err) {
    showMsg(friendlyError(err), 'error');
  }
});
</script>
</body>
</html>
