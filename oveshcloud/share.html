<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Client Catalog — OveshMalpura Cyber Labs</title><link rel="stylesheet" href="./cloud.css"></head><body><main class="login"><section class="login-card"><div class="eyebrow">OVESH MALPURA CYBER LABS</div><h1 id="title">Loading catalog…</h1><p id="sub">Verifying controlled share access.</p><div id="actions"></div></section></main><script>const token=new URLSearchParams(location.search).get('token');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){if(!token){document.querySelector('#title').textContent='Invalid share link';document.querySelector('#sub').textContent='No access token was supplied.';return}try{const r=await fetch('../api/oveshcloud-share-get?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.error||'Share unavailable');document.querySelector('#title').textContent=d.catalogName;document.querySelector('#sub').innerHTML=esc(d.clientName)+' · '+esc(d.version)+'<br><br>Controlled client delivery. This link does not grant access to the OveshCloud workspace.';document.querySelector('#actions').innerHTML='<div class="actions"><a class="btn primary" href="'+esc(d.downloadUrl)+'" target="_blank" rel="noopener">VIEW / DOWNLOAD PDF</a></div>'}catch(e){document.querySelector('#title').textContent='Catalog unavailable';document.querySelector('#sub').textContent=e.message}}run()</script></body></html>
