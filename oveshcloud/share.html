<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>OVESH CLOUD™ — Shared File</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#18243a 0,transparent 48%),#06080d;color:#eef4ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(620px,100%);border:1px solid #202838;background:rgba(13,17,25,.94);border-radius:26px;padding:32px;box-shadow:0 30px 100px rgba(0,0,0,.48)}.mark{width:58px;height:58px;border:1px solid #334155;border-radius:17px;display:grid;place-items:center;font-weight:900;letter-spacing:.08em;background:#0a0f18;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#7dd3fc;font-weight:800}.title{font-size:clamp(28px,6vw,44px);letter-spacing:-.04em;margin:12px 0}.title span{background:linear-gradient(90deg,#7dd3fc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}.file{margin-top:24px;padding:17px;border:1px solid #202838;border-radius:16px;background:#0a0e16}.file small{display:block;color:#9aa6b8;margin-bottom:7px}.file strong{display:block;word-break:break-word;font-size:18px}.button{display:inline-flex;margin-top:20px;text-decoration:none;color:#071018;background:#e6f6ff;border:1px solid #bae6fd;border-radius:12px;padding:13px 18px;font-weight:850}.status{color:#9aa6b8;line-height:1.6}.error{color:#fca5a5}.foot{margin-top:22px;font-size:11px;color:#687386}</style></head><body><main class="card"><div class="mark">OC</div><div class="eyebrow">OVESH CLOUD™ · SECURE SHARE</div><h1 class="title">A file was <span>shared with you.</span></h1><p id="status" class="status">Opening secure share…</p><div id="file" class="file" hidden><small>SHARED FILE</small><strong id="name"></strong></div><a id="download" class="button" hidden target="_blank" rel="noopener">OPEN / DOWNLOAD FILE →</a><div class="foot">This link provides access only to the selected shared file. It does not expose the owner's private cloud workspace.</div></main><script>const q=new URLSearchParams(location.search),token=q.get('token'),status=document.getElementById('status'),file=document.getElementById('file'),name=document.getElementById('name'),download=document.getElementById('download');async function openShare(){if(!token){status.textContent='This share link is missing its security token.';status.className='status error';return}try{const r=await fetch('/api/oveshcloud-share-file?action=open&token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||'This share link is unavailable.');name.textContent=x.name||'Shared file';file.hidden=false;download.href=x.downloadUrl;download.hidden=false;status.textContent='Secure access granted to this shared file.'}catch(e){status.textContent=e.message||'This share link is unavailable.';status.className='status error'}}openShare();</script></body></html>
