<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OVESH CLOUD™ — Workplace</title><link rel="stylesheet" href="/oveshcloud/cloud.css?v=workspace1"><link rel="stylesheet" href="/oveshcloud/world-class-cloud.css?v=workspace1"><link rel="stylesheet" href="/oveshcloud/global-command.css?v=workspace1"><style>body{margin:0;background:#050914;color:#fff}.workspace-launch{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,rgba(75,120,255,.16),transparent 38%),#050914}.workspace-launch-card{width:min(720px,90vw);padding:52px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(10,16,30,.78);backdrop-filter:blur(22px);text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.45)}.workspace-launch-card .oc{margin:auto;width:68px;height:68px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,#fff,rgba(255,255,255,.3));color:#07101f;font-weight:900;font-size:22px}.workspace-launch-card h1{font-size:42px;margin:24px 0 8px}.workspace-launch-card p{color:#aab5c9}.loader{margin:28px auto;width:34px;height:34px;border:3px solid rgba(255,255,255,.16);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#app{min-height:100vh}</style></head><body><div id="launch" class="workspace-launch"><div class="workspace-launch-card"><div class="oc">OC</div><h1>OVESH CLOUD™</h1><p>Opening your private command center…</p><div class="loader"></div><small>Secure workspace initialization</small></div></div><div id="app" class="app hidden"></div><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script><script src="/firebase-config.js"></script><script src="/oveshcloud/cloud.js?v=workspace1"></script><script src="/oveshcloud/workspaces.js?v=workspace1"></script><script>document.addEventListener('DOMContentLoaded',function(){var launch=document.getElementById('launch');var app=document.getElementById('app');try{if(window.state){window.state.user=window.__oveshAuthUser||{uid:'oveshcloud-admin',displayName:'Ovesh Malpura'};}if(typeof window.load==='function'){window.load();setTimeout(function(){launch.style.display='none';app.classList.remove('hidden')},350)}}catch(e){console.error(e);launch.innerHTML='<div class="workspace-launch-card"><div class="oc">OC</div><h1>OVESH CLOUD™</h1><p>Workspace could not initialize. Please try again.</p><button onclick="location.reload()">RETRY</button></div>'}});</script></body></html>
