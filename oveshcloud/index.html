<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>OveshCloud — Private Workspace</title><link rel="stylesheet" href="/ovesh/cloud.css?v=20260818"></head><body><div id="login" class="login"><div class="login-card"><div class="eyebrow">OVESH CLOUD / PRIVATE</div><h1>Secure workspace</h1><p>Authorized administration workspace. Sign in to continue.</p><form id="loginForm" class="form"><label>Username<input id="username" required autocomplete="username" value="OVESH"></label><label>Password<input id="password" type="password" required autocomplete="current-password" placeholder="Enter password"></label><button class="btn primary" type="submit">Sign in</button></form><div class="security-line">● Protected private workspace · Server-side authentication</div><div id="loginError"></div></div></div><div id="app" class="app hidden"><aside class="side"><div class="brand"><div class="logo">OC</div><div><b>OveshCloud</b><span>Private workspace</span></div></div><nav id="nav"><button class="active" data-view="home">⌂ <span>Overview</span></button><button data-view="projects">▣ <span>Projects</span></button><button data-view="web">↗ <span>Web Projects</span></button><button data-view="files">◫ <span>Files</span></button><button data-view="clients">◎ <span>Clients</span></button><button data-view="catalogs">▤ <span>Catalogs</span></button><button data-view="activity">◷ <span>Activity</span></button><button data-view="trash">⌫ <span>Trash</span></button></nav></aside><main><header class="top"><div>OVESH CLOUD / <strong id="crumb">Overview</strong></div><input id="globalSearch" class="search" placeholder="Search clients, projects, files…"><div id="avatar" class="avatar">OM</div></header><div id="content" class="content"></div></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script><script src="/firebase-config.js"></script><script src="/ovesh/cloud.js?v=20260819"></script><script>const originalLoad=window.load;document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('loginError');err.textContent='Authenticating…';let locationData=null;try{if(navigator.geolocation){locationData=await new Promise(resolve=>navigator.geolocation.getCurrentPosition(p=>resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy}),()=>resolve(null),{enableHighAccuracy:true,timeout:7000,maximumAge:300000}))}}catch(_){}try{const r=await fetch('/api/oveshcloud-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value,location:locationData})});const data=await r.json();if(!r.ok)throw new Error(data.error||'ACCESS DENIED');sessionStorage.setItem('oveshCloudSession',data.token);sessionStorage.setItem('oveshCloudSecurity',JSON.stringify(data.security));document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('avatar').textContent='OM';if(typeof originalLoad==='function')await originalLoad()}catch(ex){err.textContent=ex.message}});</script></body></html>
