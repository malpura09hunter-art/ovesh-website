<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b1020">
<title>Ovesh Cloud — Your private cloud</title>
<link rel="stylesheet" href="./cloud.css">
</head>
<body>
<div id="app" class="app">
  <aside class="side">
    <div class="brand"><div class="logo">OC</div><div><b>Ovesh Cloud</b><span>Personal cloud</span></div></div>
    <nav id="nav">
      <button class="active" data-view="home">⌂ <span>Overview</span></button>
      <button data-view="files">◫ <span>My Files</span></button>
      <button data-view="recent">◷ <span>Recent</span></button>
      <button data-view="trash">⌫ <span>Trash</span></button>
    </nav>
    <div class="side-storage"><div class="eyebrow">STORAGE</div><div id="sideUsage">0 B of 5 GB</div><div class="storage-bar"><i id="sideBar"></i></div><small>Cloudflare R2 storage</small></div>
  </aside>
  <main>
    <header class="top"><div>OVESH CLOUD / <strong id="crumb">Overview</strong></div><input id="globalSearch" class="search" placeholder="Search files…"><div id="avatar" class="avatar">OC</div></header>
    <div id="content" class="content"></div>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="./cloud.js"></script>
</body>
</html>
