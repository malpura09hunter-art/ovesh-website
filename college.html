<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Workspace | OveshMalpura Cyber Labs</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030a03;--bg2:#060f06;--bg3:#0a160a;--green:#39ff14;--green2:#00ff41;--text:#d7ffe0;--muted:#64876b;--border:rgba(57,255,20,.16);--blue:#00c8ff;--danger:#ff6070;--shadow:0 18px 60px rgba(0,0,0,.42)}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(0,255,65,.08),transparent 28%),var(--bg);color:var(--text);font-family:Rajdhani,sans-serif}button,input{font:inherit}button{cursor:pointer}
nav{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--border);background:rgba(3,10,3,.92);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}.logo{font:900 15px Orbitron;letter-spacing:2px;color:var(--green)}.nav-actions{display:flex;gap:10px}.nav-actions a,.nav-actions button{color:var(--muted);text-decoration:none;background:none;border:1px solid var(--border);padding:8px 13px;border-radius:7px}.nav-actions a:hover,.nav-actions button:hover{color:var(--green);border-color:rgba(57,255,20,.4)}
.app{max-width:1320px;margin:auto;display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 68px)}aside{border-right:1px solid var(--border);padding:25px 16px}.side-title{font:11px 'Share Tech Mono';letter-spacing:2px;color:var(--muted);margin:4px 10px 12px}.side-item{width:100%;border:1px solid transparent;background:none;color:var(--muted);padding:11px 12px;border-radius:8px;text-align:left;margin-bottom:4px}.side-item:hover,.side-item.active{background:rgba(57,255,20,.07);color:var(--green);border-color:var(--border)}
main{padding:32px;min-width:0}.eyebrow{font:11px 'Share Tech Mono';letter-spacing:3px;color:#00aa32;text-transform:uppercase;margin-bottom:7px}h1{font:700 27px Orbitron;color:var(--green);margin-bottom:8px}.sub{color:var(--muted);font-size:15px;margin-bottom:26px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(0,255,65,.025);border:1px solid var(--border);padding:12px;border-radius:11px;margin-bottom:15px}.crumbs{display:flex;align-items:center;gap:6px;flex:1;min-width:230px;overflow:auto}.crumb{background:none;border:0;color:var(--muted);white-space:nowrap}.crumb.current{color:var(--green)}.slash{color:#315e38}.search{width:210px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;outline:0}.search:focus{border-color:var(--green)}.btn{border:1px solid var(--border);background:rgba(57,255,20,.05);color:var(--green);padding:9px 13px;border-radius:7px;font-weight:600}.btn:hover{background:rgba(57,255,20,.11)}.btn.primary{background:var(--green);color:#031003;border-color:var(--green);font-weight:800}.btn.danger{color:var(--danger);border-color:rgba(255,96,112,.25);background:rgba(255,96,112,.05)}
.info{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font:11px 'Share Tech Mono';margin:10px 2px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.card{position:relative;background:linear-gradient(145deg,rgba(10,22,10,.96),rgba(4,12,5,.96));border:1px solid var(--border);border-radius:11px;padding:17px;min-height:170px;transition:.18s transform,.18s border-color,.18s box-shadow}.card:hover{transform:translateY(-2px);border-color:rgba(57,255,20,.38);box-shadow:0 10px 30px rgba(0,255,65,.06)}.icon{font-size:31px;margin-bottom:15px}.card h3{font:600 15px Orbitron;color:var(--text);word-break:break-word}.card p{color:var(--muted);font-size:13px;margin-top:7px}.folder-card{cursor:pointer}.folder-card h3{color:var(--green)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag{font:10px 'Share Tech Mono';color:var(--muted);border:1px solid var(--border);padding:4px 6px;border-radius:5px}.card-actions{position:absolute;right:12px;bottom:11px;display:flex;gap:5px}.mini{border:1px solid var(--border);background:rgba(0,0,0,.18);color:var(--muted);border-radius:5px;padding:5px 7px;font-size:12px}.mini:hover{color:var(--green)}.mini.delete:hover{color:var(--danger)}
.empty{padding:70px 20px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}.empty strong{display:block;color:var(--text);font:600 15px Orbitron;margin-bottom:8px}.empty button{margin-top:15px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:50;align-items:center;justify-content:center;padding:18px}.modal-bg.open{display:flex}.modal{width:min(520px,100%);background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:24px;box-shadow:var(--shadow)}.modal h2{font:600 18px Orbitron;color:var(--green);margin-bottom:16px}.field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:10px;outline:0}.field input:focus{border-color:var(--green)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.drop{border:1px dashed rgba(57,255,20,.35);border-radius:10px;padding:20px;text-align:center;color:var(--muted);margin-bottom:15px;background:rgba(57,255,20,.025)}.drop.drag{border-color:var(--green);background:rgba(57,255,20,.08);color:var(--green)}
.toast{position:fixed;right:20px;bottom:20px;background:#071307;border:1px solid var(--border);color:var(--text);padding:12px 15px;border-radius:8px;box-shadow:var(--shadow);display:none;z-index:80}.toast.show{display:block}
@media(max-width:850px){.app{grid-template-columns:1fr}aside{display:flex;gap:6px;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px}.side-title{display:none}.side-item{width:auto;white-space:nowrap;margin:0}main{padding:22px 15px}.search{width:100%}.toolbar{align-items:stretch}.crumbs{order:0;width:100%}.nav-actions a{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
</style>
</head>
<body>
<nav><div class="logo">OVESH MALPURA CYBER LABS</div><div class="nav-actions"><a href="dashboard.html">← Dashboard</a><button id="logout">Log Out</button></div></nav>
<div class="app">
<aside><div class="side-title">COLLEGE WORKSPACE</div><button class="side-item active" onclick="openRoot()">▦ All Subjects</button><button class="side-item" onclick="openFolder('ppc')">📁 PPC</button><button class="side-item" onclick="openFolder('webprogramming')">📁 Web Programming</button><button class="side-item" onclick="newFolder()">＋ New Folder</button></aside>
<main>
<div class="eyebrow">Private Academic Storage</div><h1>College File Explorer</h1><div class="sub">A structured workspace for your college subjects, presentations, PDFs, assignments and project files.</div>
<div class="toolbar"><div class="crumbs" id="crumbs"></div><input class="search" id="search" placeholder="Search files…"><button class="btn" onclick="document.getElementById('fileInput').click()">↑ Upload Files</button><button class="btn" onclick="newFolder()">＋ Folder</button><input id="fileInput" type="file" multiple hidden></div>
<div class="drop" id="drop">Drop files here to upload into the current folder</div>
<div class="info"><span id="locationInfo"></span><span id="countInfo"></span></div>
<div id="grid" class="grid"></div>
</main></div>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle">New Folder</h2><div class="field"><label>Folder name</label><input id="folderName" maxlength="80" placeholder="e.g. Assignments"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createFolder()">Create Folder</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DB_NAME='ovesh-college-files-v1', STORE='files';
let db, current='root', folderNames={root:'College',ppc:'PPC',webprogramming:'Web Programming'};
const seedFolders=[{id:'ppc',parent:'root',name:'PPC',type:'folder'},{id:'webprogramming',parent:'root',name:'Web Programming',type:'folder'}];
function initDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'id'});s.createIndex('parent','parent');}};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function allItems(){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readonly').objectStore(STORE).getAll();t.onsuccess=()=>resolve(t.result);t.onerror=()=>reject(t.error)})}
function put(item){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite').objectStore(STORE).put(item);t.onsuccess=resolve;t.onerror=()=>reject(t.error)})}
function remove(id){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);t.onsuccess=resolve;t.onerror=()=>reject(t.error)})}
async function seed(){let items=await allItems();if(!items.some(x=>x.id==='ppc')) for(const f of seedFolders) await put(f)}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function currentName(){return folderNames[current]||'Folder'}
async function render(){const items=await allItems();const folders=items.filter(x=>x.type==='folder');folders.forEach(x=>folderNames[x.id]=x.name);const q=document.getElementById('search').value.trim().toLowerCase();let visible=items.filter(x=>x.parent===current&&(!q||x.name.toLowerCase().includes(q)));visible.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==='folder'?-1:1);document.getElementById('crumbs').innerHTML=current==='root'?'<span class="crumb current">College</span>':`<button class="crumb" onclick="openRoot()">College</button><span class="slash">/</span><span class="crumb current">${esc(currentName())}</span>`;document.getElementById('locationInfo').textContent='LOCATION / COLLEGE / '+currentName().toUpperCase();document.getElementById('countInfo').textContent=visible.length+' ITEM'+(visible.length===1?'':'S');const grid=document.getElementById('grid');if(!visible.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><strong>${q?'No matching files':'This folder is empty'}</strong><span>${q?'Try another search.':'Upload notes, PDFs, PPTs, DOCX files or create a subfolder.'}</span>${!q?'<br><button class="btn primary" onclick="document.getElementById(\'fileInput\').click()">Upload Files</button>':''}</div>`;return}grid.innerHTML=visible.map(x=>x.type==='folder'?folderCard(x):fileCard(x)).join('')}
function folderCard(x){const n=esc(x.name);return `<div class="card folder-card" onclick="openFolder('${x.id}')"><div class="icon">📁</div><h3>${n}</h3><p>Folder</p><div class="meta"><span class="tag">SUBJECT</span></div><div class="card-actions"><button class="mini delete" onclick="event.stopPropagation();deleteFolder('${x.id}')">Delete</button></div></div>`}
function fileCard(x){const size=formatSize(x.size);return `<div class="card"><div class="icon">${fileIcon(x.name)}</div><h3>${esc(x.name)}</h3><p>${size} · ${esc(x.type||'File')}</p><div class="meta"><span class="tag">${new Date(x.createdAt).toLocaleDateString()}</span></div><div class="card-actions"><button class="mini" onclick="downloadFile('${x.id}')">↓</button><button class="mini delete" onclick="deleteFile('${x.id}')">Delete</button></div></div>`}
function fileIcon(n){const e=n.split('.').pop().toLowerCase();return ['pdf'].includes(e)?'📕':['ppt','pptx'].includes(e)?'📊':['doc','docx'].includes(e)?'📘':['xls','xlsx','csv'].includes(e)?'📗':['zip','rar','7z'].includes(e)?'🗜️':['jpg','jpeg','png','webp'].includes(e)?'🖼️':['html','css','js','c','cpp','py','java'].includes(e)?'💻':'📄'}
function formatSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(1)+' GB'}
async function upload(files){for(const f of files){await put({id:id(),parent:current,type:'file',name:f.name,size:f.size,mime:f.type,createdAt:Date.now(),blob:f})}toast(files.length+' file'+(files.length>1?'s':'')+' uploaded');render()}
document.getElementById('fileInput').addEventListener('change',e=>{upload([...e.target.files]);e.target.value='' });document.getElementById('search').addEventListener('input',render);
const drop=document.getElementById('drop');['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>upload([...e.dataTransfer.files]));
function openRoot(){current='root';document.getElementById('search').value='';render()}function openFolder(id){current=id;document.getElementById('search').value='';render()}
function newFolder(){document.getElementById('folderName').value='';document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('folderName').focus(),30)}function closeModal(){document.getElementById('modal').classList.remove('open')}async function createFolder(){const name=document.getElementById('folderName').value.trim();if(!name)return;const items=await allItems();if(items.some(x=>x.parent===current&&x.type==='folder'&&x.name.toLowerCase()===name.toLowerCase()))return toast('A folder with that name already exists');await put({id:id(),parent:current,type:'folder',name});closeModal();toast('Folder created');render()}
async function deleteFolder(folderId){const items=await allItems();const descendants=[folderId];for(let i=0;i<descendants.length;i++)items.filter(x=>x.parent===descendants[i]).forEach(x=>descendants.push(x.id));if(!confirm('Delete this folder and everything inside it?'))return;for(const x of descendants)await remove(x);toast('Folder deleted');render()}
async function deleteFile(fileId){if(!confirm('Delete this file?'))return;await remove(fileId);toast('File deleted');render()}
async function downloadFile(fileId){const items=await allItems(),x=items.find(i=>i.id===fileId);if(!x)return;const url=URL.createObjectURL(x.blob);const a=document.createElement('a');a.href=url;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.getElementById('logout').onclick=()=>{if(window.auth&&auth.signOut)auth.signOut().finally(()=>location.href='index.html');else location.href='index.html'};
(async()=>{await initDB();await seed();render()})().catch(e=>{console.error(e);toast('Could not initialize file workspace')});
</script>
</body>
</html>
