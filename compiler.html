<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OVESH COMPILER™</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<style>
:root{--bg:#070a0f;--panel:#0d121a;--panel2:#111823;--line:#202a38;--text:#e8edf5;--muted:#7f8b9d;--accent:#57f287;--danger:#ff6677;--blue:#63a4ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}button,input,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:#090d13}.brand{font-weight:800;letter-spacing:1.3px;white-space:nowrap}.brand small{color:var(--accent);font-weight:500}.program{color:var(--muted);font-size:13px;border-left:1px solid var(--line);padding-left:16px}.spacer{flex:1}.status{font:12px 'JetBrains Mono';color:var(--muted)}.btn{border:1px solid var(--line);background:#101722;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}.btn:hover{border-color:#3a485c;background:#151e2b}.run{background:var(--accent);color:#041108;border-color:var(--accent);font-weight:700}.stop{color:#ff8996}.layout{min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr) minmax(300px,34%);grid-template-rows:minmax(0,1fr) 220px}.side{grid-row:1/3;border-right:1px solid var(--line);background:#0a0f16;padding:14px;overflow:auto}.side h3,.panel-title{font-size:11px;letter-spacing:1.3px;color:var(--muted);margin:4px 0 12px}.file{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:#cfd7e3;padding:9px 10px;border-radius:7px;text-align:left;cursor:pointer;font:13px 'JetBrains Mono'}.file:hover,.file.active{background:#141c27;color:#fff}.file.active{box-shadow:inset 2px 0 var(--accent)}.new{margin-top:10px;width:100%;color:var(--accent)}.editor{min-width:0;position:relative}.editorbar{height:36px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;background:#0b1017;color:var(--muted);font:12px 'JetBrains Mono'}.monaco{position:absolute;top:36px;bottom:0;left:0;right:0}.output{min-width:0;border-left:1px solid var(--line);background:#090e15;display:flex;flex-direction:column}.console{min-height:0;overflow:auto;padding:14px;font:13px/1.6 'JetBrains Mono';white-space:pre-wrap;word-break:break-word}.bottom{grid-column:2/4;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;min-height:0}.pane{min-width:0;display:flex;flex-direction:column}.pane+ .pane{border-left:1px solid var(--line)}textarea{flex:1;resize:none;border:0;outline:0;background:#080d13;color:#cbd5e1;padding:12px;font:13px/1.5 'JetBrains Mono'}.error{color:#ff8b98}.ok{color:var(--accent)}.login{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#112319 0,#070a0f 55%);z-index:20;display:grid;place-items:center}.login-card{width:min(420px,calc(100% - 32px));padding:30px;border:1px solid #263445;border-radius:16px;background:rgba(13,18,26,.94);box-shadow:0 25px 80px #0008}.login-card h1{margin:0 0 8px;font-size:25px}.login-card p{color:var(--muted);margin:0 0 24px;font-size:14px}.login-card input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#080c12;color:white;outline:0}.login-card input:focus{border-color:var(--accent)}.login-card .btn{width:100%;margin-top:12px;padding:12px}.secure{margin-top:16px;color:var(--accent);font:11px 'JetBrains Mono';text-align:center}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr;grid-template-rows:1fr 220px 220px}.side{display:none}.output{border-left:0;border-top:1px solid var(--line)}.bottom{grid-column:1;grid-template-columns:1fr 1fr}.status{display:none}}@media(max-width:600px){.top{gap:8px;padding:0 9px}.brand{font-size:13px}.program{display:none}.top .btn{padding:7px 9px}.layout{grid-template-rows:minmax(0,1fr) 190px 190px}.bottom{grid-template-columns:1fr}.pane+ .pane{display:none}.output{min-height:0}}
</style></head>
<body>
<div class="login" id="login"><div class="login-card"><h1>OVESH COMPILER™</h1><p>Secure PPC / C programming environment</p><input id="password" type="password" placeholder="Enter compiler password" autocomplete="current-password"><button class="btn run" id="enter">ENTER COMPILER</button><div class="secure">● PROTECTED ENVIRONMENT</div><div id="loginError" class="error" style="margin-top:12px;text-align:center"></div></div></div>
<div class="app hidden" id="app"><header class="top"><div class="brand">OVESH <small>COMPILER™</small></div><div class="program" id="programName">hello.c</div><div class="spacer"></div><span class="status" id="status">READY</span><button class="btn" id="save">SAVE</button><button class="btn" id="download">DOWNLOAD</button><button class="btn stop" id="stop">■ STOP</button><button class="btn run" id="run">▶ RUN</button></header>
<main class="layout"><aside class="side"><h3>PROGRAMS</h3><div id="files"></div><button class="btn new" id="new">+ NEW PROGRAM</button></aside><section class="editor"><div class="editorbar">C / PPC&nbsp;&nbsp; • &nbsp;&nbsp;<span id="dirty">Saved</span></div><div id="editor" class="monaco"></div></section><section class="output"><div class="panel-title" style="padding:14px 14px 0">OUTPUT</div><div id="output" class="console">Ready.</div></section><section class="bottom"><div class="pane"><div class="panel-title" style="padding:12px 12px 0">INPUT / STDIN</div><textarea id="input" placeholder="Program input..."> </textarea></div><div class="pane"><div class="panel-title" style="padding:12px 12px 0">ERRORS</div><div id="errors" class="console"></div></div></section></main></div>
<script>
const KEY='oveshCompilerPrograms.v1';let programs=JSON.parse(localStorage.getItem(KEY)||'null')||[{name:'hello.c',code:'#include <stdio.h>\n\nint main() {\n    printf("Hello, Ovesh Compiler!\\n");\n    return 0;\n}\n'}];let current=0,editor,running=false,aborter=null;
const $=id=>document.getElementById(id);function persist(){localStorage.setItem(KEY,JSON.stringify(programs))}function setStatus(s){$('status').textContent=s}function renderFiles(){const box=$('files');box.innerHTML='';programs.forEach((p,i)=>{const b=document.createElement('button');b.className='file'+(i===current?' active':'');b.textContent=p.name;b.onclick=()=>openProgram(i);box.appendChild(b)})$('programName').textContent=programs[current].name}
function openProgram(i){if(editor&&editor.getValue()!==programs[current].code&&!confirm('Discard unsaved changes?'))return;current=i;editor.setValue(programs[i].code);$('dirty').textContent='Saved';renderFiles()}
function save(){programs[current].code=editor.getValue();persist();$('dirty').textContent='Saved';setStatus('SAVED');renderFiles()}
function download(){const p=programs[current],a=document.createElement('a');a.href=URL.createObjectURL(new Blob([editor.getValue()],{type:'text/plain'}));a.download=p.name;a.click();URL.revokeObjectURL(a.href)}
$('new').onclick=()=>{const n=prompt('Program name','program.c');if(!n)return;programs.push({name:n.endsWith('.c')?n:n+'.c',code:'// OVESH COMPILER™\n#include <stdio.h>\n\nint main() {\n    return 0;\n}\n'});persist();current=programs.length-1;editor.setValue(programs[current].code);renderFiles()};$('save').onclick=save;$('download').onclick=download;
require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs'}});require(['vs/editor/editor.main'],()=>{editor=monaco.editor.create($('editor'),{value:programs[0].code,language:'c',theme:'vs-dark',automaticLayout:true,fontFamily:'JetBrains Mono',fontSize:14,minimap:{enabled:false},wordWrap:'off',smoothScrolling:true,bracketPairColorization:{enabled:true}});editor.onDidChangeModelContent(()=>{$('dirty').textContent='Unsaved changes';setStatus('EDITING')});renderFiles()});
async function auth(){const p=$('password').value; if(!p)return; $('loginError').textContent='';try{const r=await fetch('/api/oveshcloud-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'OVESH',password:p})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'ACCESS DENIED');$('login').classList.add('hidden');$('app').classList.remove('hidden');localStorage.setItem('oveshCompilerAuth','1')}catch(e){$('loginError').textContent=e.message||'Authentication failed'}}$('enter').onclick=auth;$('password').onkeydown=e=>{if(e.key==='Enter')auth()};
async function run(){if(running)return;save();running=true;aborter=new AbortController();$('output').textContent='';$('errors').textContent='';setStatus('COMPILING...');try{const r=await fetch('/api/ovesh-compiler-execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:editor.getValue(),stdin:$('input').value.trim(),filename:programs[current].name}),signal:aborter.signal});const j=await r.json();if(!r.ok)throw Error(j.error||'Execution failed');$('output').textContent=j.stdout||'(no output)';$('errors').textContent=j.compile_output||j.stderr||'';$('errors').className='console '+((j.compile_output||j.stderr)?'error':'ok');setStatus(j.status||'SUCCESS')}catch(e){if(e.name==='AbortError'){$('output').textContent='Execution stopped.';setStatus('STOPPED')}else{$('errors').textContent=e.message;$('errors').className='console error';setStatus('ERROR')}}finally{running=false;aborter=null}}
$('run').onclick=run;$('stop').onclick=()=>{if(aborter){aborter.abort();setStatus('STOPPING...')}};
if(localStorage.getItem('oveshCompilerAuth')==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
</script></body></html>
