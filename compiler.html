<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OVESH COMPILER™</title>
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<style>
:root{--bg:#070a0f;--panel:#0d121a;--line:#202a38;--text:#e8edf5;--muted:#7f8b9d;--accent:#57f287}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}button,input,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:#090d13}.brand{font-weight:800;letter-spacing:1.3px;white-space:nowrap}.brand small{color:var(--accent);font-weight:500}.program{color:var(--muted);font-size:13px;border-left:1px solid var(--line);padding-left:16px}.spacer{flex:1}.status{font:12px 'JetBrains Mono';color:var(--muted)}.btn{border:1px solid var(--line);background:#101722;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}.btn:hover{border-color:#3a485c;background:#151e2b}.run{background:var(--accent);color:#041108;border-color:var(--accent);font-weight:700}.stop{color:#ff8996}.layout{min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr) minmax(300px,34%);grid-template-rows:minmax(0,1fr) 220px}.side{grid-row:1/3;border-right:1px solid var(--line);background:#0a0f16;padding:14px;overflow:auto}.side h3,.panel-title{font-size:11px;letter-spacing:1.3px;color:var(--muted);margin:4px 0 12px}.file{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:#cfd7e3;padding:9px 10px;border-radius:7px;text-align:left;cursor:pointer;font:13px 'JetBrains Mono'}.file:hover,.file.active{background:#141c27;color:#fff}.file.active{box-shadow:inset 2px 0 var(--accent)}.new{margin-top:10px;width:100%;color:var(--accent)}.editor{min-width:0;position:relative}.editorbar{height:36px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;background:#0b1017;color:var(--muted);font:12px 'JetBrains Mono'}.monaco{position:absolute;top:36px;bottom:0;left:0;right:0}.output{min-width:0;border-left:1px solid var(--line);background:#090e15;display:flex;flex-direction:column}.console{min-height:0;overflow:auto;padding:14px;font:13px/1.6 'JetBrains Mono';white-space:pre-wrap;word-break:break-word}.bottom{grid-column:2/4;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;min-height:0}.pane{min-width:0;display:flex;flex-direction:column}.pane+.pane{border-left:1px solid var(--line)}textarea{flex:1;resize:none;border:0;outline:0;background:#080d13;color:#cbd5e1;padding:12px;font:13px/1.5 'JetBrains Mono'}.error{color:#ff8b98}.ok{color:var(--accent)}@media(max-width:900px){.layout{grid-template-columns:1fr;grid-template-rows:1fr 220px 220px}.side{display:none}.output{border-left:0;border-top:1px solid var(--line)}.bottom{grid-column:1;grid-template-columns:1fr 1fr}.status{display:none}}@media(max-width:600px){.top{gap:8px;padding:0 9px}.brand{font-size:13px}.program{display:none}.top .btn{padding:7px 9px}.layout{grid-template-rows:minmax(0,1fr) 190px 190px}.bottom{grid-template-columns:1fr}.pane+.pane{display:none}.output{min-height:0}}
</style></head>
<body>
<div class="app"><header class="top"><div class="brand">OVESH <small>COMPILER™</small></div><div class="program" id="programName">hello.c</div><div class="spacer"></div><span class="status" id="status">READY • PUBLIC</span><button class="btn" id="save">SAVE</button><button class="btn" id="download">DOWNLOAD</button><button class="btn stop" id="stop">■ STOP</button><button class="btn run" id="run">▶ RUN</button></header>
<main class="layout"><aside class="side"><h3>PROGRAMS</h3><div id="files"></div><button class="btn new" id="new">+ NEW PROGRAM</button></aside><section class="editor"><div class="editorbar">C / PPC&nbsp;&nbsp; • &nbsp;&nbsp;<span id="dirty">Saved</span></div><div id="editor" class="monaco"></div></section><section class="output"><div class="panel-title" style="padding:14px 14px 0">OUTPUT</div><div id="output" class="console">Ready. Public compiler environment.</div></section><section class="bottom"><div class="pane"><div class="panel-title" style="padding:12px 12px 0">INPUT / STDIN</div><textarea id="input" placeholder="Program input..."></textarea></div><div class="pane"><div class="panel-title" style="padding:12px 12px 0">ERRORS</div><div id="errors" class="console"></div></div></section></main></div>
<script>
const KEY='oveshCompilerPrograms.v1';let programs=JSON.parse(localStorage.getItem(KEY)||'null')||[{name:'hello.c',code:'#include <stdio.h>\n\nint main() {\n    printf("Hello, Ovesh Compiler!\\n");\n    return 0;\n}\n'}];let current=0,editor,running=false,aborter=null;
const $=id=>document.getElementById(id);function persist(){localStorage.setItem(KEY,JSON.stringify(programs))}function setStatus(s){$('status').textContent=s}function renderFiles(){const box=$('files');box.innerHTML='';programs.forEach((p,i)=>{const b=document.createElement('button');b.className='file'+(i===current?' active':'');b.textContent=p.name;b.onclick=()=>openProgram(i);box.appendChild(b)})$('programName').textContent=programs[current].name}
function openProgram(i){if(editor&&editor.getValue()!==programs[current].code&&!confirm('Discard unsaved changes?'))return;current=i;editor.setValue(programs[i].code);$('dirty').textContent='Saved';renderFiles()}
function save(){programs[current].code=editor.getValue();persist();$('dirty').textContent='Saved';setStatus('SAVED • PUBLIC');renderFiles()}
function download(){const p=programs[current],a=document.createElement('a');a.href=URL.createObjectURL(new Blob([editor.getValue()],{type:'text/plain'}));a.download=p.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('new').onclick=()=>{const n=prompt('Program name','program.c');if(!n)return;programs.push({name:n.endsWith('.c')?n:n+'.c',code:'// OVESH COMPILER™\n#include <stdio.h>\n\nint main() {\n    return 0;\n}\n'});persist();current=programs.length-1;editor.setValue(programs[current].code);renderFiles()};$('save').onclick=save;$('download').onclick=download;
require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs'}});require(['vs/editor/editor.main'],()=>{editor=monaco.editor.create($('editor'),{value:programs[0].code,language:'c',theme:'vs-dark',automaticLayout:true,fontFamily:'JetBrains Mono',fontSize:14,minimap:{enabled:false},wordWrap:'off',smoothScrolling:true,bracketPairColorization:{enabled:true}});editor.onDidChangeModelContent(()=>{$('dirty').textContent='Unsaved changes';setStatus('EDITING • PUBLIC')});renderFiles()});
async function run(){if(running)return;save();running=true;aborter=new AbortController();$('output').textContent='';$('errors').textContent='';setStatus('COMPILING...');try{const r=await fetch('/api/ovesh-compiler-execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:editor.getValue(),stdin:$('input').value,filename:programs[current].name}),signal:aborter.signal});const j=await r.json();if(!r.ok)throw Error(j.error||'Execution failed');$('output').textContent=j.stdout||'(no output)';$('errors').textContent=j.compile_output||j.stderr||'';$('errors').className='console '+((j.compile_output||j.stderr)?'error':'ok');setStatus(j.status||'SUCCESS')}catch(e){if(e.name==='AbortError'){$('output').textContent='Execution stopped.';setStatus('STOPPED')}else{$('errors').textContent=e.message;$('errors').className='console error';setStatus('ERROR')}}finally{running=false;aborter=null}}
$('run').onclick=run;$('stop').onclick=()=>{if(aborter){aborter.abort();setStatus('STOPPING...')}};
document.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();save()}if(mod&&e.key==='Enter'){e.preventDefault();run()}});
</script></body></html>
