<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | OveshMalpura Cyber Labs</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030a03; --bg2: #060f06; --bg3: #0a160a;
  --neon: #00ff41; --neon2: #00cc33; --neon3: #39ff14; --dim: #00aa22;
  --text: #c8ffd4; --muted: #4a7a52;
  --card: rgba(0,255,65,0.04); --border: rgba(0,255,65,0.15);
  --glow: 0 0 20px rgba(0,255,65,0.4), 0 0 60px rgba(0,255,65,0.1);
  --error: #ff4455;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; position: relative; overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(0,255,65,0.06) 1px, transparent 1px);
  background-size: 24px 24px; pointer-events: none;
}
.logo-link { position: absolute; top: 28px; left: 28px; font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--neon3); text-decoration: none; letter-spacing: 2px; font-size: 15px; text-shadow: 0 0 10px rgba(0,255,65,0.4); }
.card {
  width: 100%; max-width: 420px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 40px 32px; box-shadow: var(--glow); position: relative; z-index: 1;
}
.eyebrow { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; color: var(--neon3); margin-bottom: 24px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-family: 'Share Tech Mono', monospace; letter-spacing: 1px; }
.field-wrap { position: relative; }
.field input {
  width: 100%; background: rgba(0,255,65,0.03); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 44px 12px 14px; color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 16px; outline: none; transition: border-color 0.2s;
}
.field input:focus { border-color: var(--neon2); box-shadow: 0 0 0 3px rgba(0,255,65,0.08); }
.toggle-visibility {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px;
  font-family: 'Share Tech Mono', monospace; letter-spacing: 0.5px; padding: 4px;
}
.toggle-visibility:hover { color: var(--neon3); }
.btn-primary {
  width: 100%; background: var(--neon2); color: #021002; border: none; border-radius: 6px;
  padding: 13px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px;
  cursor: pointer; transition: all 0.2s; text-transform: uppercase;
}
.btn-primary:hover { background: var(--neon3); box-shadow: var(--glow); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.msg { padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; display: none; }
.msg.error { background: rgba(255,68,85,0.1); border: 1px solid rgba(255,68,85,0.3); color: var(--error); display: block; }
.msg.success { background: rgba(0,255,65,0.08); border: 1px solid var(--border); color: var(--neon3); display: block; }
.requirements { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--muted); margin: -6px 0 18px 0; line-height: 1.9; }
.requirements .req { display: flex; align-items: center; gap: 8px; }
.requirements .req .mark { width: 14px; display: inline-block; color: var(--muted); }
.requirements .req.met { color: var(--neon3); }
.requirements .req.met .mark { color: var(--neon3); }
.back-link { display: block; text-align: center; margin-top: 18px; color: var(--dim); text-decoration: none; font-size: 14px; }
.back-link:hover { color: var(--neon3); }
.state { display: none; }
.state.active { display: block; }
.center-note { font-size: 15px; line-height: 1.6; color: var(--text); margin-bottom: 20px; }
.spinner-block { display: flex; justify-content: center; padding: 12px 0; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--neon3); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<a href="index.html" class="logo-link">← OVESH MALPURA CYBER LABS</a>

<div class="card">
  <div class="eyebrow">Client Portal</div>
  <h1 id="heading">Reset Password</h1>

  <div class="msg" id="formMsg"></div>

  <!-- CHECKING LINK -->
  <div class="state active" id="state-checking">
    <div class="spinner-block"><div class="spinner"></div></div>
    <p class="center-note" style="text-align:center;">Verifying your reset link…</p>
  </div>

  <!-- INVALID / EXPIRED LINK -->
  <div class="state" id="state-invalid">
    <p class="center-note" id="invalidMsg">This password reset link is invalid or has expired.</p>
    <a class="back-link" href="login.html" style="margin-top:0;">Request a new reset link →</a>
  </div>

  <!-- SET NEW PASSWORD -->
  <div class="state" id="state-form">
    <p class="center-note" id="resetForEmail" style="font-size:14px; color:var(--muted);"></p>
    <form id="resetForm">
      <div class="field">
        <label>New Password</label>
        <div class="field-wrap">
          <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
          <button type="button" class="toggle-visibility" data-target="newPassword" onclick="toggleVisibility(this)">SHOW</button>
        </div>
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <div class="field-wrap">
          <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
          <button type="button" class="toggle-visibility" data-target="confirmPassword" onclick="toggleVisibility(this)">SHOW</button>
        </div>
      </div>
      <div class="requirements">
        <div class="req" id="reqLength"><span class="mark">•</span> Minimum 6 characters</div>
        <div class="req" id="reqMatch"><span class="mark">•</span> Passwords match</div>
      </div>
      <button class="btn-primary" type="submit" id="submitBtn">Update Password</button>
    </form>
  </div>

  <!-- SUCCESS -->
  <div class="state" id="state-success">
    <p class="center-note">Your password has been updated. Redirecting you to login…</p>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function showState(id) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showMsg(text, type) {
  const el = document.getElementById('formMsg');
  if (!text) { el.className = 'msg'; el.textContent = ''; return; }
  el.textContent = text;
  el.className = 'msg ' + type;
}
function toggleVisibility(btn) {
  const input = document.getElementById(btn.dataset.target);
  const isPw = input.type === 'password';
  input.type = isPw ? 'text' : 'password';
  btn.textContent = isPw ? 'HIDE' : 'SHOW';
}

const params = new URLSearchParams(window.location.search);
const mode = params.get('mode');
const oobCode = params.get('oobCode');

let verifiedEmail = null;

(async function init() {
  if (mode !== 'resetPassword' || !oobCode) {
    document.getElementById('invalidMsg').textContent = 'This password reset link is missing required information. Please request a new one.';
    showState('state-invalid');
    return;
  }
  try {
    verifiedEmail = await auth.verifyPasswordResetCode(oobCode);
    document.getElementById('resetForEmail').textContent = 'Setting a new password for ' + verifiedEmail;
    showState('state-form');
  } catch (err) {
    document.getElementById('invalidMsg').textContent = friendlyError(err);
    showState('state-invalid');
  }
})();

const newPwInput = document.getElementById('newPassword');
const confirmPwInput = document.getElementById('confirmPassword');
const reqLength = document.getElementById('reqLength');
const reqMatch = document.getElementById('reqMatch');

function updateRequirements() {
  const pw = newPwInput.value;
  const confirmPw = confirmPwInput.value;
  reqLength.classList.toggle('met', pw.length >= 6);
  reqMatch.classList.toggle('met', pw.length > 0 && pw === confirmPw);
}
newPwInput.addEventListener('input', updateRequirements);
confirmPwInput.addEventListener('input', updateRequirements);

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  showMsg('', '');
  const pw = newPwInput.value;
  const confirmPw = confirmPwInput.value;

  if (pw.length < 6) {
    showMsg('Password must be at least 6 characters.', 'error');
    return;
  }
  if (pw !== confirmPw) {
    showMsg('Passwords do not match.', 'error');
    return;
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  try {
    await auth.confirmPasswordReset(oobCode, pw);
    showState('state-success');
    setTimeout(() => { window.location.href = 'login.html'; }, 2200);
  } catch (err) {
    showMsg(friendlyError(err), 'error');
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
