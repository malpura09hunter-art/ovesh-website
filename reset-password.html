<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | OveshMalpura Cyber Labs</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030a03; --bg2: #060f06; --bg3: #0a160a;
  --neon: #00ff41; --neon2: #00cc33; --neon3: #39ff14; --dim: #00aa22;
  --text: #c8ffd4; --muted: #4a7a52;
  --card: rgba(0,255,65,0.04); --border: rgba(0,255,65,0.15);
  --glow: 0 0 20px rgba(0,255,65,0.4), 0 0 60px rgba(0,255,65,0.1);
  --error: #ff4455;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; position: relative; overflow: hidden;
}
#matrixRain { position: fixed; inset: 0; z-index: 0; opacity: 0.55; }
body::after {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 0%, var(--bg) 78%);
}
.logo-link { position: absolute; top: 28px; left: 28px; font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--neon3); text-decoration: none; letter-spacing: 2px; font-size: 15px; text-shadow: 0 0 10px rgba(0,255,65,0.4); z-index: 2; }
.header-badge {
  width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,255,65,0.15), rgba(0,255,65,0.02));
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 24px rgba(0,255,65,0.25);
  animation: pulseBadge 2.4s ease-in-out infinite;
}
.header-badge svg { width: 28px; height: 28px; stroke: var(--neon3); }
@keyframes pulseBadge { 0%,100% { box-shadow: 0 0 18px rgba(0,255,65,0.2); } 50% { box-shadow: 0 0 30px rgba(0,255,65,0.4); } }
.card {
  width: 100%; max-width: 440px; background: linear-gradient(180deg, rgba(6,15,6,0.92), rgba(4,11,4,0.96));
  backdrop-filter: blur(6px); border: 1px solid var(--border);
  border-radius: 14px; padding: 34px 32px; box-shadow: var(--glow), inset 0 1px 0 rgba(0,255,65,0.06);
  position: relative; z-index: 1;
  animation: cardIn 0.5s ease both;
}
.card::before {
  content: ''; position: absolute; inset: -1px; border-radius: 14px; padding: 1px;
  background: linear-gradient(135deg, rgba(0,255,65,0.5), transparent 40%, transparent 60%, rgba(0,255,65,0.3));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.eyebrow { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
h1 { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 700; color: var(--neon3); margin-bottom: 22px; text-align: center; text-shadow: 0 0 16px rgba(0,255,65,0.35); }

/* ---- Progress steps ---- */
.steps { display: flex; align-items: center; margin-bottom: 28px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; }
.step-circle {
  width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; background: rgba(0,255,65,0.03);
  transition: all 0.35s ease; position: relative; flex-shrink: 0;
}
.step-circle svg { width: 15px; height: 15px; stroke: var(--muted); transition: stroke 0.3s ease; }
.step-label { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; transition: color 0.3s ease; white-space: nowrap; }
.step-line { flex: 1; height: 1.5px; background: var(--border); margin: 0 6px 18px; transition: background 0.5s ease; position: relative; overflow: hidden; }
.step-line::after {
  content: ''; position: absolute; inset: 0; background: var(--neon2); transform: scaleX(0); transform-origin: left;
  transition: transform 0.6s ease;
}
.step-line.filled::after { transform: scaleX(1); }
.step.active .step-circle { border-color: var(--neon2); background: rgba(0,255,65,0.1); box-shadow: 0 0 12px rgba(0,255,65,0.25); }
.step.active .step-circle svg { stroke: var(--neon3); }
.step.active .step-label { color: var(--neon3); }
.step.done .step-circle { border-color: var(--neon2); background: var(--neon2); }
.step.done .step-circle svg { stroke: #021002; }
.step.done .step-label { color: var(--dim); }
.step.error .step-circle { border-color: var(--error); background: rgba(255,68,85,0.12); }
.step.error .step-circle svg { stroke: var(--error); }
.step.error .step-label { color: var(--error); }

.icon-badge {
  width: 56px; height: 56px; border-radius: 50%; margin: 4px auto 18px; display: flex; align-items: center; justify-content: center;
  background: rgba(0,255,65,0.06); border: 1px solid var(--border);
}
.icon-badge svg { width: 26px; height: 26px; stroke: var(--neon3); }
.icon-badge.error-badge { background: rgba(255,68,85,0.08); border-color: rgba(255,68,85,0.3); }
.icon-badge.error-badge svg { stroke: var(--error); }
.icon-badge.success-badge svg { animation: checkDraw 0.5s ease 0.1s both; }
@keyframes checkDraw { from { stroke-dashoffset: 24; opacity: 0; } to { stroke-dashoffset: 0; opacity: 1; } }

.field { margin-bottom: 18px; }
.field label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-family: 'Share Tech Mono', monospace; letter-spacing: 1px; }
.field label svg { width: 13px; height: 13px; stroke: var(--muted); }
.field-wrap { position: relative; }
.field input {
  width: 100%; background: rgba(0,255,65,0.03); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 44px 12px 14px; color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 16px; outline: none; transition: border-color 0.2s;
}
.field input:focus { border-color: var(--neon2); box-shadow: 0 0 0 3px rgba(0,255,65,0.08); }
.toggle-visibility {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px;
  display: flex; align-items: center; justify-content: center;
}
.toggle-visibility svg { width: 17px; height: 17px; stroke: currentColor; }
.toggle-visibility:hover { color: var(--neon3); }
.toggle-visibility.showing { color: var(--neon3); }
.btn-primary {
  width: 100%; background: var(--neon2); color: #021002; border: none; border-radius: 6px;
  padding: 13px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px;
  cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:hover:not(:disabled) { background: var(--neon3); box-shadow: var(--glow); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-spinner { width: 14px; height: 14px; border: 2px solid rgba(2,16,2,0.3); border-top-color: #021002; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
.btn-primary.loading .btn-spinner { display: inline-block; }
.btn-primary.loading .btn-label { opacity: 0.85; }
.msg { padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; display: none; align-items: center; gap: 8px; animation: msgIn 0.25s ease; }
.msg svg { width: 15px; height: 15px; flex-shrink: 0; }
@keyframes msgIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.msg.error { background: rgba(255,68,85,0.1); border: 1px solid rgba(255,68,85,0.3); color: var(--error); display: flex; }
.msg.success { background: rgba(0,255,65,0.08); border: 1px solid var(--border); color: var(--neon3); display: flex; }
.requirements { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--muted); margin: -6px 0 18px 0; line-height: 1.9; }
.requirements .req { display: flex; align-items: center; gap: 8px; transition: color 0.25s ease; }
.requirements .req .mark { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.requirements .req .mark svg { width: 12px; height: 12px; stroke: var(--muted); transition: stroke 0.25s ease; opacity: 0; transform: scale(0.5); transition: all 0.25s ease; }
.requirements .req .mark .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); transition: opacity 0.2s ease; }
.requirements .req.met { color: var(--neon3); }
.requirements .req.met .mark svg { stroke: var(--neon3); opacity: 1; transform: scale(1); }
.requirements .req.met .mark .dot { opacity: 0; }
.requirements .req:not(.met) .mark svg { opacity: 0; }
.back-link { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 18px; color: var(--dim); text-decoration: none; font-size: 14px; }
.back-link svg { width: 14px; height: 14px; stroke: currentColor; }
.back-link:hover { color: var(--neon3); }
.state { display: none; }
.state.active { display: block; animation: stateIn 0.35s ease both; }
@keyframes stateIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.center-note { font-size: 15px; line-height: 1.6; color: var(--text); margin-bottom: 20px; text-align: center; }
.spinner-block { display: flex; justify-content: center; padding: 6px 0 14px; }
.spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--neon3); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<canvas id="matrixRain"></canvas>

<a href="index.html" class="logo-link">← OVESH MALPURA CYBER LABS</a>

<div class="card">
  <div class="header-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V5l8-3z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg>
  </div>
  <div class="eyebrow">Client Portal</div>
  <h1 id="heading">Reset Password</h1>

  <div class="steps" id="stepsBar">
    <div class="step active" id="step1">
      <div class="step-circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      <span class="step-label">Verify</span>
    </div>
    <div class="step-line" id="line1"></div>
    <div class="step" id="step2">
      <div class="step-circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <span class="step-label">New Pass</span>
    </div>
    <div class="step-line" id="line2"></div>
    <div class="step" id="step3">
      <div class="step-circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      <span class="step-label">Done</span>
    </div>
  </div>

  <div class="msg" id="formMsg"></div>

  <!-- CHECKING LINK -->
  <div class="state active" id="state-checking">
    <div class="spinner-block"><div class="spinner"></div></div>

  </div>

  <!-- INVALID / EXPIRED LINK -->
  <div class="state" id="state-invalid">

      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
    </div>
    <p class="center-note" id="invalidMsg">This password reset link is invalid or has expired.</p>
    <a class="back-link" href="login.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Request a new reset link
    </a>
  </div>

  <!-- SET NEW PASSWORD -->
  <div class="state" id="state-form">
    <p class="center-note" id="resetForEmail" style="font-size:14px; color:var(--muted);"></p>
    <form id="resetForm">
      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          New Password
        </label>
        <div class="field-wrap">
          <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
          <button type="button" class="toggle-visibility" data-target="newPassword" onclick="toggleVisibility(this)">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Confirm New Password
        </label>
        <div class="field-wrap">
          <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
          <button type="button" class="toggle-visibility" data-target="confirmPassword" onclick="toggleVisibility(this)">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="requirements">
        <div class="req" id="reqLength"><span class="mark"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span> Minimum 6 characters</div>
        <div class="req" id="reqMatch"><span class="mark"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span> Passwords match</div>
      </div>
      <button class="btn-primary" type="submit" id="submitBtn">
        <span class="btn-spinner"></span>
        <span class="btn-label">Update Password</span>
      </button>
    </form>
  </div>

  <!-- SUCCESS -->
  <div class="state" id="state-success">
    <div class="icon-badge success-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="24" stroke-dashoffset="0"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <p class="center-note">Your password has been updated. Redirecting you to login…</p>
  </div>

</div>

<script>
// ---- Matrix code-rain background ----
(function () {
  const canvas = document.getElementById('matrixRain');
  const ctx = canvas.getContext('2d');
  let cols, drops, fontSize = 15;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / fontSize);
    drops = new Array(cols).fill(0).map(() => Math.random() * -50);
  }
  window.addEventListener('resize', resize);
  resize();

  const chars = 'アイウエオカキクケコサシスセソタチツテト01アイウエオ0123456789';

  function draw() {
    ctx.fillStyle = 'rgba(3,10,3,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      const x = i * fontSize;
      const y = drops[i] * fontSize;
      ctx.fillStyle = Math.random() > 0.975 ? '#c8ffd4' : 'rgba(0,255,65,0.55)';
      ctx.fillText(char, x, y);
      if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 55);
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function showState(id) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showMsg(text, type) {
  const el = document.getElementById('formMsg');
  if (!text) { el.className = 'msg'; el.innerHTML = ''; return; }
  const icon = type === 'error'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  el.innerHTML = icon + '<span>' + text + '</span>';
  el.className = 'msg ' + type;
}
function toggleVisibility(btn) {
  const input = document.getElementById(btn.dataset.target);
  const isPw = input.type === 'password';
  input.type = isPw ? 'text' : 'password';
  btn.classList.toggle('showing', isPw);
}

// ---- Step indicator control ----
function setStep(n, state) {
  // state: 'active' | 'done' | 'error' — applies to step n; steps before n are marked done
  for (let i = 1; i <= 3; i++) {
    const stepEl = document.getElementById('step' + i);
    stepEl.classList.remove('active', 'done', 'error');
    if (i < n) stepEl.classList.add('done');
  }
  const line1 = document.getElementById('line1');
  const line2 = document.getElementById('line2');
  line1.classList.toggle('filled', n > 1);
  line2.classList.toggle('filled', n > 2);
  document.getElementById('step' + n).classList.add(state);
}

const params = new URLSearchParams(window.location.search);
const mode = params.get('mode');
const oobCode = params.get('oobCode');

let verifiedEmail = null;

(async function init() {
  setStep(1, 'active');
  if (mode !== 'resetPassword' || !oobCode) {
    document.getElementById('invalidMsg').textContent = 'This password reset link is missing required information. Please request a new one.';
    setStep(1, 'error');
    showState('state-invalid');
    return;
  }
  try {
    verifiedEmail = await auth.verifyPasswordResetCode(oobCode);
    document.getElementById('resetForEmail').textContent = 'Setting a new password for ' + verifiedEmail;
    setStep(2, 'active');
    showState('state-form');
  } catch (err) {
    document.getElementById('invalidMsg').textContent = friendlyError(err);
    setStep(1, 'error');
    showState('state-invalid');
  }
})();

const newPwInput = document.getElementById('newPassword');
const confirmPwInput = document.getElementById('confirmPassword');
const reqLength = document.getElementById('reqLength');
const reqMatch = document.getElementById('reqMatch');

function updateRequirements() {
  const pw = newPwInput.value;
  const confirmPw = confirmPwInput.value;
  reqLength.classList.toggle('met', pw.length >= 6);
  reqMatch.classList.toggle('met', pw.length > 0 && pw === confirmPw);
}
newPwInput.addEventListener('input', updateRequirements);
confirmPwInput.addEventListener('input', updateRequirements);

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  showMsg('', '');
  const pw = newPwInput.value;
  const confirmPw = confirmPwInput.value;

  if (pw.length < 6) {
    showMsg('Password must be at least 6 characters.', 'error');
    return;
  }
  if (pw !== confirmPw) {
    showMsg('Passwords do not match.', 'error');
    return;
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.classList.add('loading');
  try {
    await auth.confirmPasswordReset(oobCode, pw);
    setStep(3, 'done');
    document.getElementById('step3').classList.remove('done');
    document.getElementById('step3').classList.add('active');
    showState('state-success');
    setTimeout(() => { window.location.href = 'login.html'; }, 2200);
  } catch (err) {
    showMsg(friendlyError(err), 'error');
    submitBtn.disabled = false;
    submitBtn.classList.remove('loading');
  }
});
</script>
