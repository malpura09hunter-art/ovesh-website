<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Secure Client File | OV CLOUD</title>
<style>
:root{color-scheme:dark;--bg:#06111d;--panel:#0b1c2b;--line:#234356;--cyan:#42d7e8;--text:#e9f7ff;--muted:#9eb2c6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#10334a 0,transparent 48%),var(--bg);color:var(--text);font:14px/1.6 Inter,system-ui,sans-serif}.panel{width:min(680px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 24px 80px #0006}.brand{font-weight:850;letter-spacing:.08em;color:var(--cyan);font-size:12px}.muted{color:var(--muted)}h1{font-size:25px;margin:8px 0 18px;overflow-wrap:anywhere}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;background:var(--cyan);color:#05202b;text-decoration:none;font-weight:800;margin-top:14px}.notice{margin-top:14px;color:#ffb9b9}.preview{margin-top:18px;max-height:65vh;overflow:auto}.preview iframe,.preview img,.preview video{width:100%;max-height:65vh;border:1px solid var(--line);border-radius:10px;background:#fff}.hidden{display:none!important}
</style></head><body><main class="panel"><div class="brand">OV CLOUD™ · SECURE CLIENT SHARE</div><h1 id="name">Loading shared file…</h1><p class="muted" id="description">This link provides access only to the file shared with you.</p><a id="open" class="btn hidden" target="_blank" rel="noopener noreferrer">Open / Download file</a><div id="preview" class="preview"></div><div id="notice" class="notice" role="alert"></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token')||'';async function run(){if(!/^[a-f0-9]{64}$/.test(token)){$('notice').textContent='This share link is invalid.';return}try{const r=await fetch('/api/oveshcloud-client-files?action=public-share-open&token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'This share is unavailable.');$('name').textContent=d.name;$('description').textContent=d.expiresAt?'Secure link · expires '+new Date(d.expiresAt).toLocaleString():'Secure shared file';$('open').href=d.downloadUrl;$('open').classList.remove('hidden');const type=d.contentType||'';if(type.startsWith('image/'))$('preview').innerHTML='<img alt="Shared file preview" src="'+d.downloadUrl+'">';else if(type==='application/pdf')$('preview').innerHTML='<iframe title="PDF preview" src="'+d.downloadUrl+'"></iframe>';else if(type.startsWith('video/'))$('preview').innerHTML='<video controls src="'+d.downloadUrl+'"></video>';}catch(e){$('notice').textContent=e.message}}run()})();
</script></body></html>
