<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Client Login — OVESH CLOUD</title>
<style>
:root{color-scheme:dark;--line:rgba(86,207,232,.24);--cyan:#42d7e8;--muted:#9eb2c6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#10334a 0,transparent 55%),linear-gradient(145deg,#050b14,#071827 60%,#04111c);color:#e9f7ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:32px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,rgba(12,31,48,.97),rgba(5,17,29,.98));box-shadow:0 24px 90px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#0b2c3b;color:var(--cyan);font-weight:800}.brand strong{display:block;font-size:17px;letter-spacing:.03em}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:12px}h1{margin:0 0 10px;font-size:27px;letter-spacing:-.04em}p{color:var(--muted);font-size:14px;line-height:1.65}label{display:block;margin:14px 0 6px;color:#b9cfdf;font-size:11px;font-weight:700;letter-spacing:.08em}input{width:100%;margin-top:8px;padding:13px 14px;border:1px solid #244359;border-radius:9px;background:#071522;color:#effaff;font-size:14px;outline:none}input:focus{border-color:var(--cyan)}button,.link{width:100%;display:flex;justify-content:center;align-items:center;gap:9px;padding:13px 16px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}.primary{border:0;background:var(--cyan);color:#03202b;margin-top:14px}.google{border:1px solid #34546a;background:#0a2031;color:#effaff;margin-top:18px}.secondary{border:1px solid var(--line);background:transparent;color:#d7edf8;margin-top:10px}.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#7792a6;font-size:11px}.divider:before,.divider:after{content:"";height:1px;background:#203a4d;flex:1}.status{display:none;margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#0b2434;color:#c8f7fb;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.status.show{display:block}.status.error{border-color:#8c4545;background:#29151b;color:#ffd7d7}.foot{text-align:center;margin-top:22px;font-size:11px;color:#718ba0}.hidden{display:none!important}button:disabled{opacity:.6;cursor:wait}@media(max-width:420px){.card{padding:24px}}
</style>
</head>
<body>
<main class="card">
<div class="brand"><div class="mark">OC</div><div><strong>OVESH <span style="color:var(--cyan)">CLOUD</span>™</strong><small>Secure Client Portal</small></div></div>
<h1>Client workspace</h1>
<p>Sign in with your Google account or your client email and password. Only approved client accounts should be granted access to private files.</p>
<button id="googleBtn" class="google" type="button"><span aria-hidden="true">G</span> Continue with Google</button>
<div class="divider">OR USE EMAIL</div>
<form id="emailForm">
<label for="email">EMAIL ADDRESS</label><input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required>
<label for="password">PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
<button id="emailBtn" class="primary" type="submit">Sign in to client portal →</button>
</form>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div id="signedInActions" class="hidden"><button id="signOutBtn" class="secondary" type="button">Sign out</button></div>
<a class="link secondary" href="/ovesh">← Return to owner login</a>
<a class="link secondary" href="mailto:info.oveshmalpuracyberlab@zohomail.in?subject=OVESH%20CLOUD%20Client%20Access">Request client access</a>
<div class="foot">PRIVATE ACCESS · MALPURA CYBER LABS</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script>
<script>
(function(){
 const $=id=>document.getElementById(id), status=$('status');
 function message(text,error=false){status.textContent=text;status.classList.add('show');status.classList.toggle('error',error)}
 function friendly(e){const map={'auth/invalid-credential':'Email or password is incorrect.','auth/user-not-found':'No account exists for this email. Ask the owner for an invitation.','auth/wrong-password':'Email or password is incorrect.','auth/too-many-requests':'Too many attempts. Please wait and try again.','auth/popup-blocked':'The Google sign-in popup was blocked. Allow popups and try again.','auth/unauthorized-domain':'This website domain is not enabled for Google sign-in in Firebase.','auth/network-request-failed':'Network error. Check your connection and try again.','auth/operation-not-allowed':'This sign-in method is not enabled in Firebase yet.','auth/account-exists-with-different-credential':'This account uses email/password first. Sign in with email and password, then link Google from your client workspace.'};return map[e.code]||'Sign-in could not be completed. Please try again.'}
 async function afterSignIn(user){
   $('signedInActions').classList.remove('hidden');
   $('emailForm').classList.add('hidden');$('googleBtn').classList.add('hidden');
   try{
     const token=await user.getIdToken();
     const response=await fetch('/api/oveshcloud-client-files',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},credentials:'omit',cache:'no-store',body:JSON.stringify({action:'profile'})});
     const result=await response.json().catch(()=>({}));
     if(response.ok&&result.ok){message('Access approved. Opening your private client cloud…');location.replace('/client-cloud.html');}
     else if(response.status===403){message(result.error||'Your identity was verified, but client access is not active. Contact the owner.',true);}
     else {throw new Error(result.error||'Client approval check failed.');}
   }catch(e){
     console.error('Client access check failed:',e);
     message('Sign-in succeeded, but access approval could not be verified. The private workspace remains locked. Please retry or contact the owner.',true);
   }
 }
 $('googleBtn').addEventListener('click',async()=>{
   const b=$('googleBtn');b.disabled=true;status.classList.remove('show','error');
   try{const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const result=await auth.signInWithPopup(provider);await afterSignIn(result.user)}
   catch(e){message(friendly(e),true)}finally{b.disabled=false}
 });
 $('emailForm').addEventListener('submit',async e=>{
   e.preventDefault();const b=$('emailBtn');b.disabled=true;status.classList.remove('show','error');
   try{const result=await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);await afterSignIn(result.user)}
   catch(e){message(friendly(e),true)}finally{b.disabled=false}
 });
 $('signOutBtn').addEventListener('click',async()=>{try{await auth.signOut();location.reload()}catch(e){message('Unable to sign out. Please retry.',true)}});
 auth.onAuthStateChanged(user=>{if(user)afterSignIn(user)});
})();
</script>
</body></html>
